name: PR-05D Run Hotfix

on:
  push:
    branches:
      - pr-05d/github-dispatch-hotfix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-05d/github-dispatch-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply hotfix
        run: |
          python tools/apply_pr05d_hotfix.py
          python tools/update_pr05d_test_versions.py
      - name: Verify
        run: |
          npm ci --no-audit --no-fund
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run build
      - name: Commit hotfix
        run: |
          rm -f .github/workflows/pr05d-apply.yml .github/workflows/pr05d-run.yml tools/apply_pr05d_hotfix.py tools/update_pr05d_test_versions.py
          git config user.name "chihung1024"
          git config user.email "104315542+chihung1024@users.noreply.github.com"
          git add --all
          git commit -m "fix: restore GitHub workflow dispatch after Wrangler deployment"
          git push origin HEAD:pr-05d/github-dispatch-hotfix
