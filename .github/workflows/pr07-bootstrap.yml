          Path('migrations/0002_calculation_jobs.sql').write_text('''-- PR-07: durable, tenant-scoped calculation jobs and idempotent trigger identity.

CREATE TABLE IF NOT EXISTS calculation_jobs (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  public_id TEXT NOT NULL UNIQUE CHECK (length(public_id) = 26),
  user_id TEXT NOT NULL,
  idempotency_hash TEXT NOT NULL CHECK (length(idempotency_hash) = 64),
  idempotency_bucket INTEGER NOT NULL CHECK (idempotency_bucket >= 0),
  status TEXT NOT NULL DEFAULT 'queued'
    CHECK (status IN ('queued', 'running', 'succeeded', 'failed')),
  benchmark TEXT NOT NULL,
  github_run_id TEXT,
  github_run_attempt INTEGER NOT NULL DEFAULT 0 CHECK (github_run_attempt >= 0),
  attempt_count INTEGER NOT NULL DEFAULT 0 CHECK (attempt_count >= 0),
  error_code TEXT,
  created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
  started_at TEXT,
  completed_at TEXT,
  updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
  UNIQUE (user_id, idempotency_hash)
);

CREATE INDEX IF NOT EXISTS idx_calculation_jobs_user_created
  ON calculation_jobs (user_id, created_at DESC);

CREATE INDEX IF NOT EXISTS idx_calculation_jobs_status_created
  ON calculation_jobs (status, created_at DESC);

UPDATE schema_metadata
SET schema_version = 2,
    release_version = '4.07',
    applied_at = CURRENT_TIMESTAMP
WHERE id = 1 AND schema_version = 1;
''', encoding='utf-8')

          Path('.github/workflows/update.yml').write_text('''name: Update Portfolio Data

on:
  schedule:
    # Cron 使用 UTC；右側標註為台灣時間（UTC+8）。
    - cron: '0 23 * * *'     # 07:00 - 晨間更新（雙市場收盤價）
    - cron: '15 1 * * 1-5'  # 09:15 - 台股開盤後（週一至週五）
    - cron: '0 6 * * 1-5'   # 14:00 - 台股收盤後（週一至週五）
    - cron: '0 15 * * 1-5'  # 23:00 - 美股開盤後（週一至週五）
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: '自訂基準標的代碼 (例如: QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      target_user_id:
        description: '目標使用者 email (留空表示全部使用者)'
        required: false
        default: ''
        type: string
      calculation_job_id:
        description: 'Worker-issued opaque calculation job ID'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-update
  cancel-in-progress: false

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mark calculation job running
        if: ${{ github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg job_id "$JOB_ID" --arg status running --arg run_id "$GITHUB_RUN_ID_VALUE" --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" '{job_id:$job_id,status:$status,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
