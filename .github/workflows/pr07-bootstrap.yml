name: PR-07 Bootstrap Implementation

on:
  push:
    branches:
      - pr-07/calculation-jobs-idempotency

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR-07 branch
        uses: actions/checkout@v7
        with:
          ref: pr-07/calculation-jobs-idempotency
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Recover and apply PR-07 implementation script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          previous = subprocess.check_output(
              ["git", "show", "5db8ad75cd8eb8d91d55a62764c0a7d9c4936882:.github/workflows/pr07-bootstrap.yml"],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in previous or end_marker not in previous:
              raise SystemExit("Unable to recover PR-07 implementation script")
          script = previous.split(start_marker, 1)[1].split(end_marker, 1)[0]
          normalized = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )
          Path("/tmp/pr07_implementation.py").write_text(normalized + "\n", encoding="utf-8")
          PY
          python /tmp/pr07_implementation.py

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete verification
        run: |
          python -m compileall -q journal_engine main.py tools tests
          pytest -q
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run build

      - name: Commit verified non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/update.yml tools/pr07_update_workflow.yml
          git checkout -- .github/workflows/update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/pr07-bootstrap.yml' ':!.github/workflows/update.yml'
          git commit -m "PR-07: add durable idempotent calculation jobs"
          git push origin HEAD:pr-07/calculation-jobs-idempotency
