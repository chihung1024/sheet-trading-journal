name: Patch R372 stale test contracts

on:
  push:
    branches:
      - fix/market-data-stabilized-cross-granularity

permissions:
  contents: write

jobs:
  patch-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-stabilized-cross-granularity
          fetch-depth: 1
      - name: Migrate persistent-disagreement contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_market_data_repair_fallback.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    ), patch("journal_engine.clients.market_data.time.sleep"):\n        market_data, _ = client.download_data(["AAA"], pd.Timestamp("2026-05-02"))',
              '    ), patch("journal_engine.clients.market_data.time.sleep"), patch(\n        "journal_engine.clients.semantic_market_data.time.sleep"\n    ):\n        market_data, _ = client.download_data(["AAA"], pd.Timestamp("2026-05-02"))',
          )
          old = '''def test_cross_granularity_intraday_observations_must_agree():
    client = SemanticMarketDataClient()
    malformed = _malformed_history(impossible_ohlc=True)
    one_hour = _intraday_history(101.75)
    fifteen_minute = _intraday_history(101.80)
    spy = _valid_history(500.0)
    calls = defaultdict(int)

    def ticker_factory(symbol):
        calls[symbol] += 1
        if symbol != "AAA":
            return StaticTicker(spy)
        return IntradayRecoveryTicker(malformed, one_hour, fifteen_minute)

    frame = _download(client, ticker_factory)["AAA"]

    assert calls["AAA"] == 4
    assert frame["Close_Adjusted"].isna().sum() == 1
    assert PortfolioValidator.validate_price_data("AAA", frame) is False
'''
          new = '''def test_cross_granularity_intraday_observations_must_agree():
    client = SemanticMarketDataClient()
    malformed = _malformed_history(impossible_ohlc=True)
    one_hour = _intraday_history(101.75)
    fifteen_minute = _intraday_history(101.80)
    spy = _valid_history(500.0)
    calls = defaultdict(int)

    def ticker_factory(symbol):
        calls[symbol] += 1
        if symbol != "AAA":
            return StaticTicker(spy)
        return IntradayRecoveryTicker(malformed, one_hour, fifteen_minute)

    frame = _download(client, ticker_factory)["AAA"]

    # Two broad daily attempts plus two bounded 1h/15m observation rounds.
    assert calls["AAA"] == 6
    assert frame["Close_Adjusted"].isna().sum() == 1
    assert PortfolioValidator.validate_price_data("AAA", frame) is False
'''
          if old not in text:
              raise SystemExit('repair fallback contract block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('tests/test_semantic_market_data.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    ), patch("journal_engine.clients.market_data.time.sleep") as sleep:\n        market_data, _ = client.download_data(["AAA"], pd.Timestamp("2026-05-02"))',
              '    ), patch("journal_engine.clients.market_data.time.sleep") as sleep, patch(\n        "journal_engine.clients.semantic_market_data.time.sleep"\n    ):\n        market_data, _ = client.download_data(["AAA"], pd.Timestamp("2026-05-02"))',
          )
          old = '''def test_exact_date_intraday_recovery_rejects_disagreeing_granularities():
    client = SemanticMarketDataClient()
    malformed = _history(partial_price=True)
    first = _intraday_history(close=101.75)
    second = _intraday_history(close=101.80)
    spy = _history(final_close=500.0)
    calls = defaultdict(int)

    def ticker_factory(symbol):
        call_index = calls[symbol]
        calls[symbol] += 1
        if symbol != "AAA":
            return FakeTicker(spy)
        intraday = first if call_index == 2 else second
        return FakeTicker(malformed, intraday)

    market_data, _sleep = _run_download(client, ticker_factory)
    frame = market_data["AAA"]

    assert calls["AAA"] == 4
    assert frame["Close_Adjusted"].isna().sum() == 1
    assert PortfolioValidator.validate_price_data("AAA", frame) is False
'''
          new = '''def test_exact_date_intraday_recovery_rejects_disagreeing_granularities():
    client = SemanticMarketDataClient()
    malformed = _history(partial_price=True)
    first = _intraday_history(close=101.75)
    second = _intraday_history(close=101.80)
    spy = _history(final_close=500.0)
    calls = defaultdict(int)

    def ticker_factory(symbol):
        call_index = calls[symbol]
        calls[symbol] += 1
        if symbol != "AAA":
            return FakeTicker(spy)
        # Keep both bounded observation rounds genuinely divergent: recovery calls
        # are 2/3 for round one and 4/5 for round two after the two daily attempts.
        intraday = first if call_index in (2, 4) else second
        return FakeTicker(malformed, intraday)

    market_data, _sleep = _run_download(client, ticker_factory)
    frame = market_data["AAA"]

    assert calls["AAA"] == 6
    assert frame["Close_Adjusted"].isna().sum() == 1
    assert PortfolioValidator.validate_price_data("AAA", frame) is False
'''
          if old not in text:
              raise SystemExit('semantic market data contract block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit migrated tests and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-r372-tests.yml
          git add tests/test_market_data_repair_fallback.py tests/test_semantic_market_data.py
          git commit -m 'test: migrate bounded re-observation contracts'
          git push origin HEAD:fix/market-data-stabilized-cross-granularity
