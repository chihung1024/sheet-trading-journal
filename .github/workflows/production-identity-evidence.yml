name: Production Identity Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current protected-main SHA whose production contract will be audited read-only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-identity-evidence
  cancel-in-progress: false

jobs:
  unit:
    name: Verify read-only evidence collector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --test tests/production_identity_evidence.test.mjs

  production-readonly:
    name: Collect authoritative production identity evidence (GET only)
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Validate exact current-main source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact lowercase 40-character Git commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove audited source is the current protected-main head
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$REQUESTED_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Collect sanitized Cloudflare and live frontend evidence
        id: collect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          EVIDENCE_SOURCE_SHA: ${{ inputs.source_sha }}
          AUDIT_OUTPUT: production-identity-evidence.json
        run: node tools/collect_production_identity_evidence.mjs

      - name: Upload sanitized read-only evidence
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-identity-evidence-${{ inputs.source_sha }}
          path: production-identity-evidence.json
          if-no-files-found: error
          retention-days: 30
