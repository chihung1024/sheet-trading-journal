name: Production Contract Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed 40-character source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    name: Verify audit implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --test tests/test_production_contract_audit.mjs

  production:
    name: Audit exact production contract
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Validate exact SHA syntax before checkout
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be an exact lowercase 40-character Git commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate requested SHA is main-reachable
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Load canonical Worker manifest expectations
        id: manifest
        run: node tools/export_worker_manifest.mjs

      - name: Verify Recovery Evidence Gate policy
        run: node tools/verify_recovery_evidence_gate.mjs

      - name: Run sanitized production audit
        env:
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_RUNTIME_SERVICE: ${{ steps.manifest.outputs.runtime_service }}
          EXPECTED_RELEASE_VERSION: ${{ steps.manifest.outputs.release_version }}
          EXPECTED_API_VERSION: ${{ steps.manifest.outputs.api_version }}
          EXPECTED_SCHEMA_VERSION: ${{ steps.manifest.outputs.schema_version }}
          API_KEY: ${{ secrets.API_KEY }}
          REQUIRE_SYSTEM_CHECKS: '1'
          AUDIT_OUTPUT: production-contract-audit.json
        run: node tools/verify_production_contract.mjs

      - name: Verify E1a-A opaque-job compatibility proof
        shell: bash
        env:
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          API_KEY: ${{ secrets.API_KEY }}
          PROOF_FILE: production-e1a-compatibility-proof.json
        run: |
          set -euo pipefail
          test -n "$API_KEY"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          rm -f "$PROOF_FILE"

          for attempt in $(seq 1 3); do
            suffix="$(node -e "process.stdout.write(crypto.randomUUID().replaceAll('-', '').slice(0, 22))")"
            job_id="job_${suffix}"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --header "X-API-KEY: $API_KEY" "$WORKER_BASE_URL/api/calculation-jobs/$job_id" || true)"

            if [[ "$status" == "200" ]]; then
              echo "Opaque compatibility probe id unexpectedly existed on attempt $attempt; retrying with a new opaque id" >&2
              continue
            fi
            if [[ "$status" != "404" ]]; then
              echo "E1a-A compatibility proof expected 404 from trusted-system opaque-job lookup; observed status=$status" >&2
              exit 1
            fi

            COMPAT_BODY="$(cat "$body")" EXPECTED_SHA="$EXPECTED_SHA" PROOF_FILE="$PROOF_FILE" node <<'NODE'
          const { writeFileSync } = require('node:fs');
          let payload;
          try {
            payload = JSON.parse(process.env.COMPAT_BODY || '');
          } catch {
            throw new Error('compatibility 404 response was not valid JSON');
          }
          if (payload?.success !== false || payload?.error_meta?.code !== 'NOT_FOUND') {
            throw new Error('compatibility response did not prove NOT_FOUND semantics');
          }
          const serialized = JSON.stringify(payload);
          if (/target_user_id|user_id|email|owner/i.test(serialized)) {
            throw new Error('compatibility not-found proof exposed tenant identity material');
          }
          writeFileSync(process.env.PROOF_FILE, `${JSON.stringify({
            schema_version: 1,
            check_name: 'e1a_opaque_job_system_compatibility',
            status: 'passed',
            observed_at: new Date().toISOString(),
            source_sha: process.env.EXPECTED_SHA,
            proof: {
              result: 'pass',
              http_status: 404,
              error_code: 'NOT_FOUND',
              tenant_identity_returned: false,
              probe_id_recorded: false,
              summary: 'Trusted-system GET to a valid-format intentionally nonexistent opaque job id reached the E1a-A compatibility route and returned 404 NOT_FOUND without tenant identity.',
            },
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
            echo "E1a-A compatibility proof passed: 404 NOT_FOUND without tenant identity"
            exit 0
          done

          echo "Unable to obtain a nonexistent opaque probe id after three collision-safe attempts" >&2
          exit 1

      - name: Upload sanitized audit evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-contract-audit-${{ inputs.expected_sha }}
          path: |
            production-contract-audit.json
            production-e1a-compatibility-proof.json
          if-no-files-found: error
          retention-days: 30
