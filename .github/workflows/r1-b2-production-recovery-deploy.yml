name: R1 Final Production Recovery Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: r1-final-production-recovery-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy exact recovery Worker
    if: contains(github.event.head_commit.message, '[r1-final-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify one-shot activation ancestry
        shell: bash
        env:
          EXPECTED_PARENT_SHA: a300939f105b2a9e93ac1a363ddc3018066b2edb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          test "$parent_count" = "2"
          first_parent="$(git rev-parse HEAD^1)"
          if [ "$first_parent" != "$EXPECTED_PARENT_SHA" ]; then
            echo "Refusing production activation from unexpected main parent: $first_parent" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify protected production deployment inputs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_D1_DATABASE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required protected production value: $name" >&2
              exit 1
            fi
          done

      - name: Render exact production Worker config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run worker:config:render

      - name: Dry-run exact Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --strict --config .wrangler/deploy.toml

      - name: Deploy exact Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy

      - name: Verify deployed source identity and retained public contract
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKER_URL: https://journal-backend.chired.workers.dev/api/portfolio
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/r1-final-worker-headers.txt"
          body="$RUNNER_TEMP/r1-final-worker-body.json"

          header_value() {
            local key="$1"
            awk -v wanted="$key" '
              BEGIN { IGNORECASE=1 }
              $0 ~ "^" wanted ":" {
                sub(/^[^:]+:[[:space:]]*/, "")
                sub(/\r$/, "")
                print
                exit
              }
            ' "$headers"
          }

          for attempt in $(seq 1 20); do
            rm -f "$headers" "$body"
            status="$(curl --silent --show-error --max-time 15 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$WORKER_URL" || true)"
            source_commit="$(header_value x-source-commit || true)"
            api_version="$(header_value x-api-version || true)"
            release_version="$(header_value x-release-version || true)"
            schema_version="$(header_value x-schema-version || true)"

            if [ "$status" = "401" ] \
              && [ "$source_commit" = "$EXPECTED_SHA" ] \
              && [ "$api_version" = "2.65" ] \
              && [ "$release_version" = "4.12" ] \
              && [ "$schema_version" = "3" ]; then
              echo "Production Worker identity verified on attempt $attempt"
              exit 0
            fi

            echo "Worker not yet stable on attempt $attempt: status=$status source=$source_commit api=$api_version release=$release_version schema=$schema_version"
            sleep 3
          done

          echo "Production Worker did not converge to the exact merged source identity" >&2
          cat "$headers" >&2 || true
          cat "$body" >&2 || true
          exit 1
