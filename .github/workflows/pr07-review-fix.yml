name: PR-07 Review Fixes

on:
  push:
    branches:
      - pr-07/calculation-jobs-idempotency

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.head_commit.message == 'PR07 recover store wrapper marker'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR-07 branch
        uses: actions/checkout@v7
        with:
          ref: pr-07/calculation-jobs-idempotency
          fetch-depth: 0

      - name: Recover reviewed fix script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ["git", "show", "52032e5eb13e35a4c1754a43479e193d9c8048f8:.github/workflows/pr07-review-fix.yml"],
              text=True,
          )
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in source or end not in source:
              raise SystemExit("Unable to recover reviewed fix script")
          body = source.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          old_marker = "marker = '''    };" + "\n\n" + "    return {" + "\n" + "        portfolio," + "\n'''"
          new_marker = "marker = '''    };" + "\n\n" + "    return {" + "\n" + "        loading," + "\n'''"
          old_wrapper_tail = "    return {" + "\n" + "        portfolio," + "\n'''" + "\n          portfolio = replace_once(portfolio, marker, wrapper,"
          new_wrapper_tail = "    return {" + "\n" + "        loading," + "\n'''" + "\n          portfolio = replace_once(portfolio, marker, wrapper,"
          if old_marker not in script or old_wrapper_tail not in script:
              raise SystemExit("Recovered script store markers are unavailable")
          script = script.replace(old_marker, new_marker, 1)
          script = script.replace(old_wrapper_tail, new_wrapper_tail, 1)
          Path("/tmp/pr07_review_fix.py").write_text(script + "\n", encoding="utf-8")
          PY
          python /tmp/pr07_review_fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete verification
        run: |
          python -m compileall -q journal_engine main.py tools tests
          pytest -q
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run build

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js migrations/0002_calculation_jobs.sql src/stores/portfolio.js tests/worker_calculation_jobs.test.mjs tools/test_d1_schema.mjs
          git commit -m "PR-07: harden idempotency across retries and concurrency"
          git push origin HEAD:pr-07/calculation-jobs-idempotency
