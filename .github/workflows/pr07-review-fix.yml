            if (Date.now() - pending.createdAt >= CALCULATION_REQUEST_TTL_MS) {
                localStorage.removeItem(CALCULATION_REQUEST_STORAGE_KEY);
                return null;
            }
            return pending;
        } catch {
            localStorage.removeItem(CALCULATION_REQUEST_STORAGE_KEY);
            return null;
        }
