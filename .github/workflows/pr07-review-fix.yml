    };
''',
              "frontend stable key helper",
          )
          portfolio = replace_once(
              portfolio,
              "    const triggerUpdate = async (benchmark = null) => {",
              "    const performTriggerUpdate = async (benchmark = null) => {",
              "frontend trigger implementation name",
          )
          portfolio = replace_once(
