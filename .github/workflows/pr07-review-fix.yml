name: PR-07 Review Fixes

on:
  push:
    branches:
      - pr-07/calculation-jobs-idempotency

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.head_commit.message == 'PR07 review fixes bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR-07 branch
        uses: actions/checkout@v7
        with:
          ref: pr-07/calculation-jobs-idempotency
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply independent review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          worker_path = Path("worker.js")
          worker = worker_path.read_text(encoding="utf-8")
          worker = replace_once(
              worker,
              '''    const idempotencyBucket = Math.floor(Date.now() / 1000 / CALCULATION_JOB_WINDOW_SECONDS);
    const idempotencyHash = await hashCalculationJobIdempotency(
      principal.email,
      idempotencyKey,
      idempotencyBucket,
    );
''',
              '''    const idempotencyHash = await hashCalculationJobIdempotency(
      principal.email,
      idempotencyKey,
    );
''',
              "trigger hash window",
