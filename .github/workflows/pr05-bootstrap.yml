name: PR-05 Bootstrap

on:
  push:
    branches:
      - pr-05/worker-reproducible-deployment

permissions:
  contents: write

concurrency:
  group: pr05-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR-05 branch
        uses: actions/checkout@v7
        with:
          ref: pr-05/worker-reproducible-deployment
          fetch-depth: 0

      - name: Materialize reviewed PR-05 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pr05-bootstrap/chunk-* > /tmp/pr05-payload.b64
          base64 --decode /tmp/pr05-payload.b64 > /tmp/pr05-payload.tar.gz
          echo "686a2fc476fc8ea3db258fcfe7082f29a91c5a0ee5a7b87afda46bbb2658c574  /tmp/pr05-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/pr05-payload.tar.gz -C .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate lockfile and verify Worker package
        run: |
          npm install --no-audit --no-fund
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run build

      - name: Commit PR-05 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr05-bootstrap
          rm -f .github/workflows/pr05-bootstrap.yml
          git config user.name "chihung1024"
          git config user.email "104315542+chihung1024@users.noreply.github.com"
          git add --all
          git commit -m "PR-05: add reproducible Worker deployment and version traceability"
          git push origin HEAD:pr-05/worker-reproducible-deployment
