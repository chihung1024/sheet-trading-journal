name: R1 B3 Patch Queued Job Context

on:
  push:
    branches:
      - fix/unify-calculation-pipeline-20260826

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/unify-calculation-pipeline-20260826
      - name: Allow trusted queued job context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('journal_engine/clients/api_client.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '        """Resolve the owner and durable benchmark for one running opaque job."""\n',
                  '        """Resolve the owner and durable benchmark for one accepted opaque job."""\n',
              ),
              (
                  '        if status != "running":\n'
                  '            raise CloudflareAPIError(\n'
                  '                f"calculation job context is not runnable [status={status or \'missing\'}]"\n'
                  '            )\n',
                  '        if status not in {"queued", "running"}:\n'
                  '            raise CloudflareAPIError(\n'
                  '                f"calculation job context is not runnable [status={status or \'missing\'}]"\n'
                  '            )\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one canonical match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q journal_engine/clients/api_client.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/api_client.py
          git commit -m 'fix: allow queued trusted calculation context'
          git push origin HEAD:fix/unify-calculation-pipeline-20260826
