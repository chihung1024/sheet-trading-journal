name: Update Portfolio Data

on:
  push:
    branches:
      - main
  schedule:
    # Cron uses UTC; comments show Taiwan time (UTC+8).
    - cron: '0 23 * * *'     # 07:00 - morning refresh
    - cron: '15 1 * * 1-5'  # 09:15 - Taiwan market open
    - cron: '0 6 * * 1-5'   # 14:00 - Taiwan market close
    - cron: '0 15 * * 1-5'  # 23:00 - US market open
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: 'Custom benchmark ticker (for example QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      calculation_job_id:
        description: 'Worker-issued opaque calculation job ID'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: read
  statuses: write

concurrency:
  group: portfolio-update
  cancel-in-progress: false
  queue: max

jobs:
  pages-terminal-audit:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read authoritative GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/pages" > /tmp/pages.json
          cat /tmp/pages.json | jq '{html_url,status,build_type,source,cname,https_enforced}'
          source_desc="$(jq -r '"branch=" + (.source.branch // "none") + " path=" + (.source.path // "none") + " build=" + (.build_type // "unknown")' /tmp/pages.json)"
          url_desc="$(jq -r '(.html_url // "none") + " status=" + (.status // "unknown")' /tmp/pages.json)"
          gh api -X POST "repos/$repo/statuses/$GITHUB_SHA" -f state=success -f context='Pages terminal audit/source' -f description="$source_desc" >/dev/null
          gh api -X POST "repos/$repo/statuses/$GITHUB_SHA" -f state=success -f context='Pages terminal audit/url' -f description="$url_desc" >/dev/null

  run-and-upload:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark calculation job running
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status running \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run calculation and upload to API
        id: calculation
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOM_BENCHMARK: ${{ github.event.inputs.custom_benchmark || 'SPY' }}
          CALCULATION_JOB_ID: ${{ github.event.inputs.calculation_job_id || '' }}
        run: python tools/run_portfolio_update.py

      - name: Report calculation job result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          JOB_STATUS: ${{ steps.calculation.outcome == 'success' && 'succeeded' || 'failed' }}
          JOB_ERROR_CODE: ${{ steps.calculation.outputs.error_code }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "succeeded" ]]; then
            JOB_ERROR_CODE=""
          else
            case "$JOB_ERROR_CODE" in
              CONFIGURATION_FAILED|RECORDS_API_FAILED|SETTINGS_API_FAILED|RECORD_VALIDATION_FAILED|MARKET_DATA_FAILED|CALCULATION_FAILED|RECONCILIATION_FAILED|SNAPSHOT_VALIDATION_FAILED|SNAPSHOT_UPLOAD_FAILED|MULTIPLE_USER_FAILURES|UNKNOWN_CALCULATION_FAILED)
                ;;
              *) JOB_ERROR_CODE="CALCULATION_FAILED" ;;
            esac
          fi
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status "$JOB_STATUS" \
            --arg error_code "$JOB_ERROR_CODE" \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,error_code:$error_code,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Fail workflow when calculation failed
        if: ${{ always() && steps.calculation.outcome != 'success' }}
        run: exit 1
