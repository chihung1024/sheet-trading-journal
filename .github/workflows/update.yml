name: Update Portfolio Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * *'
    - cron: '15 1 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: 'Custom benchmark ticker (for example QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      calculation_job_id:
        description: 'Worker-issued opaque calculation job ID'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: portfolio-update
  cancel-in-progress: false
  queue: max

jobs:
  actions-history-gc:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Purge completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for pass in 1 2 3; do
            gh api --paginate "repos/$repo/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id' > /tmp/run-ids.txt
            count="$(wc -l < /tmp/run-ids.txt | tr -d ' ')"
            echo "pass=$pass completed_runs=$count"
            [ "$count" = "0" ] && break
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              code="$(curl -sS -o /tmp/delete-run.out -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$repo/actions/runs/$run_id")"
              case "$code" in
                204|404) ;;
                *) cat /tmp/delete-run.out >&2; echo "run deletion failed: id=$run_id http=$code" >&2; exit 1 ;;
              esac
            done < /tmp/run-ids.txt
          done

      - name: Purge artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' > /tmp/artifact-ids.txt
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api -X DELETE "repos/$repo/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done < /tmp/artifact-ids.txt
          gh api --paginate "repos/$repo/actions/caches?per_page=100" --jq '.actions_caches[].id' > /tmp/cache-ids.txt
          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            gh api -X DELETE "repos/$repo/actions/caches/$cache_id" >/dev/null 2>&1 || true
          done < /tmp/cache-ids.txt

      - name: Verify history storage is empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          completed="$(gh api "repos/$repo/actions/runs?status=completed&per_page=1" --jq '.total_count')"
          artifacts="$(gh api "repos/$repo/actions/artifacts?per_page=1" --jq '.total_count')"
          caches="$(gh api "repos/$repo/actions/caches?per_page=1" --jq '.total_count')"
          echo "completed_runs=$completed artifacts=$artifacts caches=$caches"
          [ "$completed" = "0" ]
          [ "$artifacts" = "0" ]
          [ "$caches" = "0" ]

  run-and-upload:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark calculation job running
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg job_id "$JOB_ID" --arg status running --arg run_id "$GITHUB_RUN_ID_VALUE" --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" '{job_id:$job_id,status:$status,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" -H "X-API-KEY: $API_KEY" -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run calculation and upload to API
        id: calculation
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOM_BENCHMARK: ${{ github.event.inputs.custom_benchmark || 'SPY' }}
          CALCULATION_JOB_ID: ${{ github.event.inputs.calculation_job_id || '' }}
        run: python tools/run_portfolio_update.py

      - name: Report calculation job result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          JOB_STATUS: ${{ steps.calculation.outcome == 'success' && 'succeeded' || 'failed' }}
          JOB_ERROR_CODE: ${{ steps.calculation.outputs.error_code }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "succeeded" ]]; then JOB_ERROR_CODE=""; else
            case "$JOB_ERROR_CODE" in
              CONFIGURATION_FAILED|RECORDS_API_FAILED|SETTINGS_API_FAILED|RECORD_VALIDATION_FAILED|MARKET_DATA_FAILED|CALCULATION_FAILED|RECONCILIATION_FAILED|SNAPSHOT_VALIDATION_FAILED|SNAPSHOT_UPLOAD_FAILED|MULTIPLE_USER_FAILURES|UNKNOWN_CALCULATION_FAILED) ;;
              *) JOB_ERROR_CODE="CALCULATION_FAILED" ;;
            esac
          fi
          payload="$(jq -cn --arg job_id "$JOB_ID" --arg status "$JOB_STATUS" --arg error_code "$JOB_ERROR_CODE" --arg run_id "$GITHUB_RUN_ID_VALUE" --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" '{job_id:$job_id,status:$status,error_code:$error_code,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" -H "X-API-KEY: $API_KEY" -H 'Content-Type: application/json' --data "$payload" >/dev/null

      - name: Fail workflow when calculation failed
        if: ${{ always() && steps.calculation.outcome != 'success' }}
        run: exit 1
