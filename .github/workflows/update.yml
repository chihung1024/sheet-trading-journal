name: Update Portfolio Data

on:
  schedule:
    # Cron 使用 UTC；右側標註為台灣時間（UTC+8）。
    - cron: '0 23 * * *'     # 07:00 - 晨間更新（雙市場收盤價）
    - cron: '15 1 * * 1-5'  # 09:15 - 台股開盤後（週一至週五）
    - cron: '0 6 * * 1-5'   # 14:00 - 台股收盤後（週一至週五）
    - cron: '0 15 * * 1-5'  # 23:00 - 美股開盤後（週一至週五）
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: '自訂基準標的代碼 (例如: QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      target_user_id:
        description: '目標使用者 email (留空表示全部使用者)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run calculation and upload to API
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOM_BENCHMARK: ${{ github.event.inputs.custom_benchmark || 'SPY' }}
          TARGET_USER_ID: ${{ github.event.inputs.target_user_id || '' }}
        run: python main.py
