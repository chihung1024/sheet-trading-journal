name: Update Portfolio Data

on:
  schedule:
    # Cron 使用 UTC；右側標註為台灣時間（UTC+8）。
    - cron: '0 23 * * *'     # 07:00 - 晨間更新（雙市場收盤價）
    - cron: '15 1 * * 1-5'  # 09:15 - 台股開盤後（週一至週五）
    - cron: '0 6 * * 1-5'   # 14:00 - 台股收盤後（週一至週五）
    - cron: '0 15 * * 1-5'  # 23:00 - 美股開盤後（週一至週五）
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: '自訂基準標的代碼 (例如: QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      target_user_id:
        description: 'Gate C audit-only target email; normal calculations must not use this input'
        required: false
        default: ''
        type: string
      calculation_job_id:
        description: 'Worker-issued opaque calculation job ID'
        required: false
        default: ''
        type: string
      transaction_integrity_audit_only:
        description: 'Gate C 唯讀交易完整性稽核（不計算、不上傳快照）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 同一 repository 只允許一個 portfolio update / read-only audit 執行，避免與上傳流程重疊。
# cancel-in-progress=false 讓既有執行完成，新觸發排隊而不是中斷。
concurrency:
  group: portfolio-update
  cancel-in-progress: false

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject audit mode calculation callbacks
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.transaction_integrity_audit_only == 'true' && github.event.inputs.calculation_job_id != '' }}
        run: |
          echo 'Gate C audit mode cannot be attached to a calculation job.' >&2
          exit 1

      - name: Reject legacy normal calculation targeting
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.transaction_integrity_audit_only != 'true' && github.event.inputs.target_user_id != '' && github.event.inputs.calculation_job_id == '' }}
        run: |
          echo 'Normal hosted calculations cannot target a tenant by email. Use a Worker-issued calculation_job_id.' >&2
          exit 1

      - name: Mark calculation job running
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.transaction_integrity_audit_only != 'true' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status running \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run transaction integrity read-only audit
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.transaction_integrity_audit_only == 'true' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TARGET_USER_ID: ${{ github.event.inputs.target_user_id || '' }}
        run: python tools/audit_transaction_integrity.py

      - name: Run calculation and upload to API
        id: calculation
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.transaction_integrity_audit_only != 'true' }}
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOM_BENCHMARK: ${{ github.event.inputs.custom_benchmark || 'SPY' }}
          CALCULATION_JOB_ID: ${{ github.event.inputs.calculation_job_id || '' }}
        run: python tools/run_portfolio_update.py

      - name: Report calculation job result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.transaction_integrity_audit_only != 'true' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          JOB_STATUS: ${{ steps.calculation.outcome == 'success' && 'succeeded' || 'failed' }}
          JOB_ERROR_CODE: ${{ steps.calculation.outputs.error_code }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "succeeded" ]]; then
            JOB_ERROR_CODE=""
          else
            case "$JOB_ERROR_CODE" in
              CONFIGURATION_FAILED|RECORDS_API_FAILED|SETTINGS_API_FAILED|RECORD_VALIDATION_FAILED|MARKET_DATA_FAILED|CALCULATION_FAILED|RECONCILIATION_FAILED|SNAPSHOT_VALIDATION_FAILED|SNAPSHOT_UPLOAD_FAILED|MULTIPLE_USER_FAILURES|UNKNOWN_CALCULATION_FAILED)
                ;;
              *)
                JOB_ERROR_CODE="CALCULATION_FAILED"
                ;;
            esac
          fi
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status "$JOB_STATUS" \
            --arg error_code "$JOB_ERROR_CODE" \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,error_code:$error_code,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Fail workflow when calculation failed
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.transaction_integrity_audit_only != 'true') && steps.calculation.outcome != 'success' }}
        run: exit 1
