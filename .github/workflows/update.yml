name: Update Portfolio Data

on:
  push:
    branches:
      - main
  schedule:
    # Cron uses UTC; comments show Taiwan time (UTC+8).
    - cron: '0 23 * * *'     # 07:00 - morning refresh
    - cron: '15 1 * * 1-5'  # 09:15 - Taiwan market open
    - cron: '0 6 * * 1-5'   # 14:00 - Taiwan market close
    - cron: '0 15 * * 1-5'  # 23:00 - US market open
  workflow_dispatch:
    inputs:
      custom_benchmark:
        description: 'Custom benchmark ticker (for example QQQ, TQQQ, 0050.TW)'
        required: false
        default: 'SPY'
        type: string
      calculation_job_id:
        description: 'Worker-issued opaque calculation job ID'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-update
  cancel-in-progress: false
  queue: max

jobs:
  d1-terminal-purity:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Require existing Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"

      - name: Render verified production D1 configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run worker:config:render

      - name: Reconcile exact owned synthetic production records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ github.sha }}
          REQUIRE_CHANGES: '0'
          AUDIT_OUTPUT: production-test-record-reconciliation.json
        run: node tools/reconcile_production_test_records.mjs

      - name: Verify reconciliation result is clean
        run: |
          set -euo pipefail
          node - <<'NODE'
          const evidence = JSON.parse(require('node:fs').readFileSync('production-test-record-reconciliation.json', 'utf8'));
          if (evidence?.status !== 'passed') process.exit(1);
          if (evidence?.result?.target_rows_after !== 0) process.exit(1);
          if (evidence?.result?.test_tenant_records_remaining !== 0) process.exit(1);
          console.log(`D1 synthetic-record purity passed; removed=${evidence.result.mutation_changes}`);
          NODE

  run-and-upload:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark calculation job running
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status running \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run calculation and upload to API
        id: calculation
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOM_BENCHMARK: ${{ github.event.inputs.custom_benchmark || 'SPY' }}
          CALCULATION_JOB_ID: ${{ github.event.inputs.calculation_job_id || '' }}
        run: python tools/run_portfolio_update.py

      - name: Report calculation job result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.calculation_job_id != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ github.event.inputs.calculation_job_id }}
          JOB_STATUS: ${{ steps.calculation.outcome == 'success' && 'succeeded' || 'failed' }}
          JOB_ERROR_CODE: ${{ steps.calculation.outputs.error_code }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "succeeded" ]]; then
            JOB_ERROR_CODE=""
          else
            case "$JOB_ERROR_CODE" in
              CONFIGURATION_FAILED|RECORDS_API_FAILED|SETTINGS_API_FAILED|RECORD_VALIDATION_FAILED|MARKET_DATA_FAILED|CALCULATION_FAILED|RECONCILIATION_FAILED|SNAPSHOT_VALIDATION_FAILED|SNAPSHOT_UPLOAD_FAILED|MULTIPLE_USER_FAILURES|UNKNOWN_CALCULATION_FAILED)
                ;;
              *) JOB_ERROR_CODE="CALCULATION_FAILED" ;;
            esac
          fi
          payload="$(jq -cn \
            --arg job_id "$JOB_ID" \
            --arg status "$JOB_STATUS" \
            --arg error_code "$JOB_ERROR_CODE" \
            --arg run_id "$GITHUB_RUN_ID_VALUE" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            '{job_id:$job_id,status:$status,error_code:$error_code,github_run_id:$run_id,github_run_attempt:$run_attempt}')"
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$WORKER_BASE_URL/api/calculation-jobs/status" \
            -H "X-API-KEY: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Fail workflow when calculation failed
        if: ${{ always() && steps.calculation.outcome != 'success' }}
        run: exit 1
