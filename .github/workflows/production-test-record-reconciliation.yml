name: Production Test Record Reconciliation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit containing the reviewed reconciliation control plane
        required: true
        type: string
      require_changes:
        description: Fail unless at least one exact owned synthetic record is removed
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: production-test-record-reconciliation
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify reconciliation control plane before reviewer gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_sha: ${{ steps.source.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Verify exact current protected-main source
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_sha must be an exact lowercase 40-character Git commit SHA' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$REQUESTED_SHA"
          echo "expected_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify zero nonterminal Update Portfolio Data runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_WORKFLOW: update.yml
        run: node tools/reconcile_legacy_calculation_jobs.mjs check-github-active-runs

  production:
    name: Reconcile exact owned synthetic records and verify production
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Re-verify exact protected-main control plane after reviewer gate
        env:
          REQUESTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$REQUESTED_SHA"
      - name: Render production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.expected_sha }}
        run: npm run worker:config:render
      - name: Verify exact production D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          EXPECTED_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$EXPECTED_D1_DATABASE_ID"
          test -n "$EXPECTED_D1_DATABASE_NAME"
          D1_INFO_JSON="$(npx wrangler d1 info "$EXPECTED_D1_DATABASE_NAME" --json --config .wrangler/deploy.toml)"
          export D1_INFO_JSON
          node tools/verify_d1_identity.mjs
      - name: Require three consecutive zero-nonterminal portfolio-update observations
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_WORKFLOW: update.yml
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node tools/reconcile_legacy_calculation_jobs.mjs check-github-active-runs
            echo "Zero-nonterminal-run observation $attempt/3 passed"
            if [[ "$attempt" != 3 ]]; then sleep 3; fi
          done
      - name: Reconcile only exact owned production synthetic records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
          REQUIRE_CHANGES: ${{ inputs.require_changes && '1' || '0' }}
          AUDIT_OUTPUT: production-test-record-reconciliation.json
        run: node tools/reconcile_production_test_records.mjs
      - name: Dispatch merged-main Update Portfolio Data after reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -nc '{ref:"main",inputs:{custom_benchmark:"0050.TW"}}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/dispatches" --input -

          run_id=''
          for _ in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?event=workflow_dispatch&branch=main&per_page=30" > "$RUNNER_TEMP/update-runs.json"
            run_id="$(jq -r --arg sha "$EXPECTED_SHA" --arg started "$started" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | last | .id // empty' "$RUNNER_TEMP/update-runs.json")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "POST_RECONCILIATION_UPDATE_RUN_ID=$run_id"

          for _ in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/update-run.json"
            status="$(jq -r .status "$RUNNER_TEMP/update-run.json")"
            conclusion="$(jq -r '.conclusion // empty' "$RUNNER_TEMP/update-run.json")"
            run_number="$(jq -r .run_number "$RUNNER_TEMP/update-run.json")"
            echo "POST_RECONCILIATION_UPDATE_RUN_NUMBER=$run_number STATUS=$status CONCLUSION=${conclusion:-pending}"
            if [[ "$status" = completed ]]; then
              test "$conclusion" = success
              jq -nc --argjson id "$run_id" --argjson number "$run_number" --arg conclusion "$conclusion" '{run_id:$id,run_number:$number,conclusion:$conclusion}' > post-reconciliation-update.json
              exit 0
            fi
            sleep 5
          done
          echo 'Post-reconciliation Update Portfolio Data did not complete within verifier bound.' >&2
          exit 1
      - name: Upload sanitized reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-test-record-reconciliation-${{ needs.preflight.outputs.expected_sha }}
          path: |
            production-test-record-reconciliation.json
            post-reconciliation-update.json
          if-no-files-found: warn
          retention-days: 30
