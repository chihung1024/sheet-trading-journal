name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character merge commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify production activation before reviewer gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate exact SHA syntax before checkout
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact lowercase 40-character Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact requested runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is reachable from protected main
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$actual" refs/remotes/origin/main; then
            echo "Refusing to deploy a commit that is not reachable from main" >&2
            exit 1
          fi

      - name: Set up Node.js for policy verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Verify runtime Recovery Evidence Gate
        run: node tools/verify_recovery_evidence_gate.mjs

      - name: Verify deployable production runtime preconditions
        run: node tools/verify_production_runtime_preconditions.mjs

      - name: Verify production activation authority from protected main control plane
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          control_plane="$RUNNER_TEMP/production-control-plane-preflight"
          rm -rf "$control_plane"
          git worktree add --detach "$control_plane" refs/remotes/origin/main
          (
            cd "$control_plane"
            EXPECTED_SHA="$REQUESTED_SHA" node tools/verify_production_activation_authority.mjs
          )

  deploy:
    name: Migrate, deploy, and verify Worker
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate exact SHA syntax before checkout
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact lowercase 40-character Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact requested runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is an exact main-reachable commit
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REQUESTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$actual" refs/remotes/origin/main; then
            echo "Refusing to deploy a commit that is not reachable from main" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Load expected versions from Worker manifest
        id: manifest
        run: node tools/export_worker_manifest.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker verification gates
        run: |
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run worker:recovery-gate:check

      - name: Re-verify deployable production runtime preconditions
        run: node tools/verify_production_runtime_preconditions.mjs

      - name: Re-verify production activation authority from latest protected main
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          control_plane="$RUNNER_TEMP/production-control-plane-after-approval"
          rm -rf "$control_plane"
          git worktree add --detach "$control_plane" refs/remotes/origin/main
          (
            cd "$control_plane"
            EXPECTED_SHA="$REQUESTED_SHA" node tools/verify_production_activation_authority.mjs
          )

      - name: Verify protected deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"

      - name: Render production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run worker:config:render

      - name: Verify exact production D1 control-plane identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          EXPECTED_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          D1_INFO_JSON="$(npx wrangler d1 info "$EXPECTED_D1_DATABASE_NAME" --json --config .wrangler/deploy.toml)"
          export D1_INFO_JSON
          node tools/verify_d1_identity.mjs

      - name: Final activation authority check before remote D1 mutation
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          control_plane="$RUNNER_TEMP/production-control-plane-before-migration"
          rm -rf "$control_plane"
          git worktree add --detach "$control_plane" refs/remotes/origin/main
          (
            cd "$control_plane"
            EXPECTED_SHA="$REQUESTED_SHA" node tools/verify_production_activation_authority.mjs
          )

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply DB
          --remote
          --config .wrangler/deploy.toml

      - name: Final activation authority check before Worker deploy
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          control_plane="$RUNNER_TEMP/production-control-plane-before-worker-deploy"
          rm -rf "$control_plane"
          git worktree add --detach "$control_plane" refs/remotes/origin/main
          (
            cd "$control_plane"
            EXPECTED_SHA="$REQUESTED_SHA" node tools/verify_production_activation_authority.mjs
          )

      - name: Deploy canonical Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy

      - name: Verify expected production deployment has propagated
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_RUNTIME_SERVICE: ${{ steps.manifest.outputs.runtime_service }}
          EXPECTED_RELEASE_VERSION: ${{ steps.manifest.outputs.release_version }}
          EXPECTED_API_VERSION: ${{ steps.manifest.outputs.api_version }}
          EXPECTED_SCHEMA_VERSION: ${{ steps.manifest.outputs.schema_version }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail

          wait_for_expected_deployment() {
            local version_body
            local health_body
            local version_status=""
            local health_status=""
            version_body="$(mktemp)"
            health_body="$(mktemp)"

            for attempt in $(seq 1 20); do
              version_status="$(curl --silent --show-error --output "$version_body" --write-out '%{http_code}' "$WORKER_BASE_URL/api/version" || true)"
              health_status="$(curl --silent --show-error --output "$health_body" --write-out '%{http_code}' "$WORKER_BASE_URL/api/health" || true)"

              if [[ "$version_status" == "200" && "$health_status" == "200" ]]; then
                if VERSION_JSON="$(cat "$version_body")" \
                  HEALTH_JSON="$(cat "$health_body")" \
                  EXPECTED_SHA="$EXPECTED_SHA" \
                  EXPECTED_RUNTIME_SERVICE="$EXPECTED_RUNTIME_SERVICE" \
                  EXPECTED_RELEASE_VERSION="$EXPECTED_RELEASE_VERSION" \
                  EXPECTED_API_VERSION="$EXPECTED_API_VERSION" \
                  EXPECTED_SCHEMA_VERSION="$EXPECTED_SCHEMA_VERSION" \
                  node tools/verify_worker_deployment.mjs; then
                  echo "Expected deployment became ready on attempt $attempt"
                  return 0
                fi
              else
                echo "Operational endpoints not ready on attempt $attempt: version=$version_status health=$health_status"
              fi

              sleep 3
            done

            echo "Expected deployment did not propagate within the readiness window" >&2
            echo "Final endpoint status: version=$version_status health=$health_status" >&2
            cat "$version_body" >&2 || true
            cat "$health_body" >&2 || true
            return 1
          }

          wait_for_expected_deployment

      - name: Verify post-deploy public auth and CORS contract
        env:
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_RUNTIME_SERVICE: ${{ steps.manifest.outputs.runtime_service }}
          EXPECTED_RELEASE_VERSION: ${{ steps.manifest.outputs.release_version }}
          EXPECTED_API_VERSION: ${{ steps.manifest.outputs.api_version }}
          EXPECTED_SCHEMA_VERSION: ${{ steps.manifest.outputs.schema_version }}
          AUDIT_OUTPUT: production-post-deploy-public-audit.json
        run: node tools/verify_production_contract.mjs

      - name: Upload sanitized post-deploy evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-post-deploy-${{ steps.source.outputs.sha }}
          path: production-post-deploy-public-audit.json
          if-no-files-found: error
          retention-days: 30
