name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character merge commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and verify Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is an exact main-reachable commit
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$actual" refs/remotes/origin/main; then
            echo "Refusing to deploy a commit that is not reachable from main" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker verification gates
        run: |
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test

      - name: Verify protected deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"

      - name: Render production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run worker:config:render

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply DB
          --remote
          --config .wrangler/deploy.toml

      - name: Deploy canonical Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy

      - name: Verify production version and health
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail

          fetch_until_200() {
            local path="$1"
            local body_file="$2"
            local status=""
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' "$WORKER_BASE_URL$path" || true)"
              if [[ "$status" == "200" ]]; then
                echo "$path returned 200 on attempt $attempt"
                return 0
              fi
              echo "$path returned ${status:-curl-error} on attempt $attempt"
              sleep 3
            done
            echo "$path did not become ready; final status=${status:-curl-error}" >&2
            cat "$body_file" >&2 || true
            return 1
          }

          version_body="$(mktemp)"
          health_body="$(mktemp)"
          fetch_until_200 /api/version "$version_body"
          fetch_until_200 /api/health "$health_body"

          VERSION_JSON="$(cat "$version_body")" HEALTH_JSON="$(cat "$health_body")" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const version = JSON.parse(process.env.VERSION_JSON);
          const health = JSON.parse(process.env.HEALTH_JSON);
          const expected = process.env.EXPECTED_SHA.toLowerCase();
          if (version.source_commit !== expected) {
            throw new Error(`Version source mismatch: ${version.source_commit} != ${expected}`);
          }
          if (version.release_version !== "4.05" || version.api_version !== "2.57" || version.schema_version !== 1) {
            throw new Error(`Unexpected Worker version metadata: ${JSON.stringify(version)}`);
          }
          if (!version.worker_version?.id) {
            throw new Error(`Missing Cloudflare Worker version ID: ${JSON.stringify(version)}`);
          }
          if (health.status !== "ok" || health.observed_schema_version !== 1) {
            throw new Error(`Worker health check failed: ${JSON.stringify(health)}`);
          }
          console.log(`Production Worker verified at ${expected}`);
          console.log(`Cloudflare Worker version: ${version.worker_version.id}`);
          NODE
