name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and verify Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker verification gates
        run: |
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test

      - name: Verify protected deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"

      - name: Render production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: npm run worker:config:render

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply DB
          --remote
          --config .wrangler/deploy.toml

      - name: Deploy canonical Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy

      - name: Verify production version and health
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          WORKER_BASE_URL: https://journal-backend.chired.workers.dev
        run: |
          set -euo pipefail
          version_json="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$WORKER_BASE_URL/api/version")"
          health_json="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$WORKER_BASE_URL/api/health")"
          VERSION_JSON="$version_json" HEALTH_JSON="$health_json" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const version = JSON.parse(process.env.VERSION_JSON);
          const health = JSON.parse(process.env.HEALTH_JSON);
          const expected = process.env.EXPECTED_SHA.toLowerCase();
          if (version.source_commit !== expected) {
            throw new Error(`Version source mismatch: ${version.source_commit} != ${expected}`);
          }
          if (version.release_version !== "4.05" || version.api_version !== "2.57") {
            throw new Error(`Unexpected Worker version metadata: ${JSON.stringify(version)}`);
          }
          if (health.status !== "ok" || health.observed_schema_version !== 1) {
            throw new Error(`Worker health check failed: ${JSON.stringify(health)}`);
          }
          console.log(`Production Worker verified at ${expected}`);
          console.log(`Cloudflare Worker version: ${version.worker_version?.id || "unavailable"}`);
          NODE
