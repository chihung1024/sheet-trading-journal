name: Patch row-composed market-data recovery

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317-final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-row-recovery-composition
          persist-credentials: true
          fetch-depth: 1
      - name: Apply source refactor
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('journal_engine/clients/semantic_market_data.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import threading\nimport time\n', 'import threading\n', 1)
          old_constants = '_MAX_INTRADAY_OBSERVATION_ROUNDS = 2\n_INTRADAY_REOBSERVATION_DELAY_SECONDS = 1.0\n'
          if old_constants not in text:
              raise RuntimeError('temporal recovery constants missing')
          text = text.replace(old_constants, '_INTRADAY_TIEBREAKER_INTERVAL = "5m"\n', 1)

          start = text.index('    @classmethod\n    def _pure_action_only_signature')
          end = text.index('    def _prepare_data', start)
          classifier = indent(dedent('''
          @classmethod
          def _dividend_action_only_signature(cls, frame: pd.DataFrame):
              """Return independently eligible dividend-only invalid rows.

              Other malformed rows are ignored by this classifier so they cannot suppress
              stable corporate-action evidence from a different date. Unsupported rows are
              never normalized here and remain visible to the final fail-closed validator.
              """
              if frame is None or frame.empty or "Close_Adjusted" not in frame.columns:
                  return None
              selected = pd.to_numeric(frame["Close_Adjusted"], errors="coerce")
              invalid = frame.loc[selected.isna()]
              if invalid.empty:
                  return ()
              required = _RAW_PRICE_COLUMNS + ("Volume",) + _REQUIRED_ACTION_COLUMNS + ("Split_Factor",)
              if any(column not in frame.columns for column in required):
                  return None
              signature = []
              for raw_date, row in invalid.iterrows():
                  if any(not pd.isna(row[column]) for column in _RAW_PRICE_COLUMNS):
                      continue
                  volume = row["Volume"]
                  if not pd.isna(volume):
                      numeric_volume = cls._finite_number(volume)
                      if numeric_volume is None or numeric_volume != 0.0:
                          continue
                  dividend = cls._finite_number(row["Dividends"])
                  split = cls._finite_number(row["Stock Splits"])
                  split_factor = cls._finite_number(row["Split_Factor"])
                  if dividend is None or dividend <= 0.0:
                      continue
                  if split is None or split != 0.0:
                      continue
                  if split_factor is None or split_factor <= 0.0:
                      continue
                  capital_gain = 0.0
                  if "Capital Gains" in frame.columns and not pd.isna(row["Capital Gains"]):
                      capital_gain = cls._finite_number(row["Capital Gains"])
                      if capital_gain is None:
                          continue
                  if capital_gain != 0.0:
                      continue
                  event_date = cls._normalize_date(raw_date)
                  if event_date is None:
                      return None
                  signature.append((event_date, dividend, split, split_factor))
              return tuple(signature)

          '''), '    ')
          text = text[:start] + classifier + text[end:]
          text = text.replace('self._pure_action_only_signature(prepared)', 'self._dividend_action_only_signature(prepared)')
          text = text.replace('cls._pure_action_only_signature(frame)', 'cls._dividend_action_only_signature(frame)')

          old_gate = '            if original_actions != (0.0, 0.0, 0.0):\n                return frame, ()\n'
          if old_gate not in text:
              raise RuntimeError('action gate missing')
          text = text.replace(
              old_gate,
              '            if original_actions is None or original_actions != (0.0, 0.0, 0.0):\n                continue\n',
              1,
          )

          session_contract = '                    intervals=INTRADAY_EVIDENCE_INTERVALS,\n'
          if session_contract not in text:
              raise RuntimeError('session interval contract missing')
          text = text.replace(
              session_contract,
              '                    intervals=INTRADAY_EVIDENCE_INTERVALS + (_INTRADAY_TIEBREAKER_INTERVAL,),\n',
              1,
          )

          block_start = text.index('            prior_disagreement:')
          marker = '            staged[event_date] = consensus\n'
          block_end = text.index(marker, block_start) + len(marker)
          consensus = indent(dedent('''
          consensus: dict[str, float] | None = None
          try:
              with evidence_session.observation(event_date) as observation:
                  candidates: dict[str, dict[str, float]] = {}
                  for interval in INTRADAY_EVIDENCE_INTERVALS:
                      intraday = observation.fetch(interval)
                      candidate = self._complete_intraday_price_candidate(intraday, event_date)
                      if candidate is None:
                          logger.warning(
                              "[%s] exact-date raw intraday evidence invalid for %s interval=%s; fail closed",
                              symbol,
                              event_date.strftime("%Y-%m-%d"),
                              interval,
                          )
                          return frame, ()
                      candidates[interval] = candidate[0]

                  first_interval, second_interval = INTRADAY_EVIDENCE_INTERVALS
                  first = candidates[first_interval]
                  second = candidates[second_interval]
                  if self._intraday_price_candidates_agree(first, second):
                      consensus = first
                  else:
                      logger.warning(
                          "[%s] exact-date raw intraday primary granularities disagree for %s; requesting %s tie-breaker",
                          symbol,
                          event_date.strftime("%Y-%m-%d"),
                          _INTRADAY_TIEBREAKER_INTERVAL,
                      )
                      intraday = observation.fetch(_INTRADAY_TIEBREAKER_INTERVAL)
                      candidate = self._complete_intraday_price_candidate(intraday, event_date)
                      if candidate is None:
                          logger.warning(
                              "[%s] exact-date raw intraday tie-breaker invalid for %s; fail closed",
                              symbol,
                              event_date.strftime("%Y-%m-%d"),
                          )
                          return frame, ()
                      tie_breaker = candidate[0]
                      matches_first = self._intraday_price_candidates_agree(tie_breaker, first)
                      matches_second = self._intraday_price_candidates_agree(tie_breaker, second)
                      if matches_first == matches_second:
                          logger.warning(
                              "[%s] exact-date raw intraday evidence has no unique 2-of-3 consensus for %s; fail closed",
                              symbol,
                              event_date.strftime("%Y-%m-%d"),
                          )
                          return frame, ()
                      consensus = first if matches_first else second
                      logger.warning(
                          "[%s] exact-date raw intraday disagreement resolved by %s 2-of-3 consensus for %s",
                          symbol,
                          _INTRADAY_TIEBREAKER_INTERVAL,
                          event_date.strftime("%Y-%m-%d"),
                      )
          except YahooIntradayEvidenceError as exc:
              logger.warning(
                  "[%s] exact-date fresh Yahoo intraday observation failed for %s: %s",
                  symbol,
                  event_date.strftime("%Y-%m-%d"),
                  exc,
              )
              return frame, ()

          if consensus is None:
              return frame, ()
          staged[event_date] = consensus
          '''), '            ')
          text = text[:block_start] + consensus + text[block_end:]

          old_rebuilt = '        rebuilt = super()._prepare_data(symbol, work)\n        if self._selected_price_contains_nan(rebuilt):\n            return frame, ()\n'
          if old_rebuilt not in text:
              raise RuntimeError('rebuilt gate missing')
          rebuilt = indent(dedent('''
          rebuilt = super()._prepare_data(symbol, work)
          rebuilt_selected = pd.to_numeric(rebuilt["Close_Adjusted"], errors="coerce")
          for event_date in staged:
              if event_date not in rebuilt_selected.index:
                  return frame, ()
              rebuilt_value = rebuilt_selected.loc[event_date]
              if isinstance(rebuilt_value, pd.Series):
                  return frame, ()
              numeric_value = self._finite_number(rebuilt_value)
              if numeric_value is None or numeric_value <= 0.0:
                  return frame, ()
          '''), '        ')
          text = text.replace(old_rebuilt, rebuilt, 1)

          text = text.replace(
              '"same-provider raw 1h/15m regular-session observations"',
              '"same-provider raw 1h/15m regular-session observations with 5m tie-breaker when required"',
              1,
          )
          composition_gate = '                continue\n\n            with self._semantic_attempt_lock:'
          if composition_gate not in text:
              raise RuntimeError('post-intraday continue missing')
          text = text.replace(
              composition_gate,
              '                frame = recovered\n\n            with self._semantic_attempt_lock:',
              1,
          )

          if '_pure_action_only_signature' in text:
              raise RuntimeError('old classifier remains')
          if 'time.sleep' in text or '_MAX_INTRADAY_OBSERVATION_ROUNDS' in text:
              raise RuntimeError('old temporal retry remains')
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q journal_engine/clients/semantic_market_data.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py
          git diff --cached --check
          git commit -m 'fix: compose row-level market data recovery evidence'
          git push origin HEAD:fix/market-data-row-recovery-composition
