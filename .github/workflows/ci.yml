name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-cross-granularity-cleanup:
    name: Repair #3317 coverage cleanup indentation
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-cross-granularity-evidence
          fetch-depth: 1

      - name: Repair indentation and verify syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('journal_engine/clients/semantic_market_data.py')
          text = path.read_text(encoding='utf-8')
          broken = '''        # Aggregate validity is already guaranteed by the validated constituent
          # bars: max(High)/min(Low) necessarily contain the first Open and last
          # Close, and the last bar already proved Close == Adj Close.
          return values, tuple(bar_signature)
          '''
          # YAML block indentation can strip leading spaces inside the embedded
          # literal, so target the exact checked-in malformed text explicitly.
          malformed = (
              '        # Aggregate validity is already guaranteed by the validated constituent\n'
              '# bars: max(High)/min(Low) necessarily contain the first Open and last\n'
              '# Close, and the last bar already proved Close == Adj Close.\n'
              'return values, tuple(bar_signature)\n'
          )
          fixed = (
              '        # Aggregate validity is already guaranteed by the validated constituent\n'
              '        # bars: max(High)/min(Low) necessarily contain the first Open and last\n'
              '        # Close, and the last bar already proved Close == Adj Close.\n'
              '        return values, tuple(bar_signature)\n'
          )
          if malformed not in text:
              raise SystemExit('malformed aggregate block not found')
          path.write_text(text.replace(malformed, fixed, 1), encoding='utf-8')
          PY
          python -m py_compile journal_engine/clients/semantic_market_data.py tests/test_semantic_market_data_classifier.py
          git diff --check

      - name: Commit target branch repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py
          git commit -m 'fix: repair cross-granularity cleanup indentation'
          git push origin HEAD:fix/market-data-cross-granularity-evidence
