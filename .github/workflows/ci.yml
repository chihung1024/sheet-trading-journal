name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q journal_engine main.py tools tests

      - name: Run test suite
        run: python -m pytest -q

  worker-security:
    name: Worker security and deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker test suites
        run: npm run test:worker

      - name: Verify Worker deployment metadata
        run: npm run worker:config:check

      - name: Apply and verify D1 baseline locally
        run: npm run worker:schema:test

  frontend-build:
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend security contract tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build
