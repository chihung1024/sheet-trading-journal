name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-empty-bucket-volume-guard:
    name: Apply #3317 empty bucket volume guard
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-cross-granularity-evidence
          fetch-depth: 1

      - name: Add contradictory empty-bucket volume guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('journal_engine/clients/semantic_market_data.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '            if not any(present):\n'
              '                # keepna=True intentionally preserves no-trade buckets for sparse\n'
              '                # symbols. A fully empty price bucket is absence of evidence, not\n'
              '                # contradictory price evidence; partial buckets still fail below.\n'
              '                continue\n'
          )
          new = (
              '            if not any(present):\n'
              '                empty_volume = (\n'
              '                    cls._finite_number(row["Volume"]) if "Volume" in row.index else None\n'
              '                )\n'
              '                if empty_volume is not None and empty_volume != 0.0:\n'
              '                    return None\n'
              '                # keepna=True intentionally preserves no-trade buckets for sparse\n'
              '                # symbols. A fully empty price bucket is absence of evidence only\n'
              '                # when it also carries no contradictory non-zero volume. Partial\n'
              '                # buckets and price-empty traded buckets remain fail-closed.\n'
              '                continue\n'
          )
          if old not in text:
              raise SystemExit('expected empty-bucket block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile journal_engine/clients/semantic_market_data.py
          git diff --check

      - name: Commit target branch guard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py
          git commit -m 'fix: reject contradictory empty intraday buckets'
          git push origin HEAD:fix/market-data-cross-granularity-evidence
