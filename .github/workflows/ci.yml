name: CI

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-update-3320-log:
    name: Inspect Update Portfolio Data #3320 log
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract recovery and validator evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '95669108505'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs"
          curl --silent --show-error --fail-with-body -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > job.log

          echo '=== RECOVERY / VALIDATOR EVIDENCE ==='
          grep -E -i \
            'exact-date raw intraday|cross-validated|persistent invalid daily|invalid price data|MARKET_DATA_FAILED|granularit|fail closed|failed to recover|NaN' \
            job.log | tail -n 500 || true

          echo '=== FINAL FAILURE CONTEXT ==='
          tail -n 220 job.log
