name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-update-3317-fix:
    name: Verify Update Portfolio Data 3317 fix
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch merged main and require production success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 7642ace742eef34e1ab408c56384c3226f0a984e
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          current_main="$(curl --silent --show-error --fail-with-body "${headers[@]}" "$api/branches/main" | jq -r '.commit.sha')"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

          before="$(curl --silent --show-error --fail-with-body "${headers[@]}" "$api/actions/workflows/update.yml/runs?event=workflow_dispatch&per_page=20")"
          before_number="$(printf '%s' "$before" | jq '[.workflow_runs[].run_number] | max // 0')"

          payload='{"ref":"main","inputs":{"custom_benchmark":"0050.TW","target_user_id":"","calculation_job_id":"","transaction_integrity_audit_only":"false"}}'
          curl --silent --show-error --fail-with-body "${headers[@]}" \
            -X POST "$api/actions/workflows/update.yml/dispatches" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

          run_id=''
          for _ in $(seq 1 24); do
            response="$(curl --silent --show-error --fail-with-body "${headers[@]}" "$api/actions/workflows/update.yml/runs?event=workflow_dispatch&per_page=20")"
            run_id="$(printf '%s' "$response" | jq -r --arg sha "$EXPECTED_MAIN_SHA" --argjson before "$before_number" '.workflow_runs[] | select(.head_sha == $sha and .run_number > $before) | .id' | head -n1)"
            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"

          conclusion=''
          for _ in $(seq 1 72); do
            run="$(curl --silent --show-error --fail-with-body "${headers[@]}" "$api/actions/runs/$run_id")"
            status="$(printf '%s' "$run" | jq -r '.status')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // empty')"
            if [[ "$status" == "completed" ]]; then
              printf '%s\n' "$(printf '%s' "$run" | jq -c '{id,name,run_number,event,status,conclusion,head_sha,created_at,updated_at,html_url}')"
              break
            fi
            sleep 5
          done

          test "$conclusion" = 'success'

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify workflow supply-chain policy
        run: python tests/test_workflow_supply_chain.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q journal_engine main.py tools tests

      - name: Run test suite and measure branch coverage
        run: >-
          python -m pytest -q
          --cov=journal_engine
          --cov=main
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json

      - name: Verify measured Python coverage baseline
        run: >-
          python tools/verify_python_coverage.py
          coverage.json
          docs/governance/python-coverage-baseline.json

  worker-security:
    name: Worker security and deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker test suites
        run: npm run test:worker

      - name: Verify Worker deployment metadata
        run: npm run worker:config:check

      - name: Enforce Recovery Evidence Gate
        run: npm run worker:recovery-gate:check

      - name: Apply and verify D1 baseline locally
        run: npm run worker:schema:test

  frontend-build:
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend security contract tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build
