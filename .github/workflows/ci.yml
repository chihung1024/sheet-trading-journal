name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-cross-granularity-coverage-cleanup:
    name: Apply #3317 coverage cleanup to target branch
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-cross-granularity-evidence
          fetch-depth: 1

      - name: Remove unreachable aggregate guards and add real fail-closed regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('journal_engine/clients/semantic_market_data.py')
          source = source_path.read_text(encoding='utf-8')
          dead = '''        if (
              values["High"] < values["Low"]
              or values["High"] < max(values["Open"], values["Close"])
              or values["Low"] > min(values["Open"], values["Close"])
          ):
              return None
          if not math.isclose(
              values["Close"],
              values["Adj Close"],
              rel_tol=_PRICE_REL_TOL,
              abs_tol=_PRICE_ABS_TOL,
          ):
              return None
          return values, tuple(bar_signature)
          '''.replace('\n    ', '\n        ')
          replacement = '''        # Aggregate validity is already guaranteed by the validated constituent
          # bars: max(High)/min(Low) necessarily contain the first Open and last
          # Close, and the last bar already proved Close == Adj Close.
          return values, tuple(bar_signature)
          '''
          if dead not in source:
              start = source.index('        if (\n            values["High"] < values["Low"]')
              end_marker = '        return values, tuple(bar_signature)\n'
              end = source.index(end_marker, start) + len(end_marker)
              source = source[:start] + replacement + source[end:]
          else:
              source = source.replace(dead, replacement, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_semantic_market_data_classifier.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_exact_date_intraday_recovery_rejects_invalid_granularity_before_second_query():'
          if marker not in tests:
              tests += '''\n\n\ndef test_exact_date_intraday_recovery_rejects_invalid_granularity_before_second_query():
              client = SemanticMarketDataClient()
              frame = _prepared_partial_row()
              with patch(
                  "journal_engine.clients.semantic_market_data.yf.Ticker",
                  return_value=_Ticker(pd.DataFrame()),
              ) as ticker:
                  result, dates = client._recover_with_exact_date_intraday_evidence("AAA", frame)

              assert result is frame
              assert dates == ()
              assert ticker.call_count == 1
          '''
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Commit target branch patch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py tests/test_semantic_market_data_classifier.py
          git commit -m 'test: close cross-granularity coverage gaps'
          git push origin HEAD:fix/market-data-cross-granularity-evidence
