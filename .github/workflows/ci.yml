name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-empty-bucket-volume:
    name: Verify #3317 empty bucket volume semantics
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install production market data dependencies
        run: python -m pip install --disable-pip-version-check yfinance==1.5.2 pandas==2.3.3 numpy==2.2.6
      - name: Inspect fully empty price buckets
        run: |
          python - <<'PY'
          import json
          import math
          import pandas as pd
          import yfinance as yf

          target = pd.Timestamp('2026-08-17')
          columns = ('Open', 'High', 'Low', 'Close', 'Adj Close')
          for symbol in ('AIHY', 'PHOX'):
              result = {'symbol': symbol}
              for interval in ('1h', '15m'):
                  frame = yf.Ticker(symbol).history(
                      start=target,
                      end=target + pd.Timedelta(days=1),
                      interval=interval,
                      auto_adjust=False,
                      actions=False,
                      prepost=False,
                      repair=False,
                      keepna=True,
                  )
                  rows = []
                  for timestamp, row in frame.iterrows():
                      if timestamp.date() != target.date():
                          continue
                      prices = []
                      for column in columns:
                          value = row[column] if column in row.index else None
                          try:
                              value = float(value)
                              value = value if math.isfinite(value) else None
                          except (TypeError, ValueError):
                              value = None
                          prices.append(value)
                      if all(value is None for value in prices):
                          volume = row['Volume'] if 'Volume' in row.index else None
                          try:
                              volume = float(volume)
                              volume = volume if math.isfinite(volume) else None
                          except (TypeError, ValueError):
                              volume = None
                          rows.append({'timestamp': timestamp.isoformat(), 'volume': volume})
                  result[interval] = rows
              print(json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
