name: CI

on:
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-update-3320-log:
    name: Capture Update Portfolio Data #3320 evidence
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: diagnostic/update-portfolio-3317
          fetch-depth: 1

      - name: Extract raw production evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '95669108505'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs"
          curl --silent --show-error --fail-with-body -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > job.log
          mkdir -p docs/diagnostic
          {
            echo '=== RECOVERY / VALIDATOR EVIDENCE ==='
            grep -E -i 'exact-date raw intraday|cross-validated|persistent invalid daily|invalid price data|MARKET_DATA_FAILED|granularit|fail closed|failed to recover|NaN' job.log | tail -n 800 || true
            echo '=== FINAL FAILURE CONTEXT ==='
            tail -n 300 job.log
          } > docs/diagnostic/update-3320-extract.txt

      - name: Commit diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostic/update-3320-extract.txt
          git commit -m 'chore: capture Update Portfolio Data 3320 evidence' || exit 0
          git push origin HEAD:diagnostic/update-portfolio-3317
