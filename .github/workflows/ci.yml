name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-update-3317-cross-granularity:
    name: Diagnose remaining #3317 cross-granularity evidence
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 533b076e4beba34b72549f5bb39b9588bb14724f
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compare stable 1h and 15m exact-date price evidence
        run: |
          python - <<'PY'
          import json
          import math
          import time
          import pandas as pd
          import yfinance as yf

          target = pd.Timestamp('2026-08-17')
          symbols = ['AIHY', 'COST', 'LIN', 'ORLY', 'PHOX', 'WMB']
          price_columns = ('Open', 'High', 'Low', 'Close', 'Adj Close')

          def finite(value):
              try:
                  result = float(value)
              except (TypeError, ValueError):
                  return None
              return result if math.isfinite(result) else None

          def summarize(frame):
              if frame is None or frame.empty:
                  return {'raw_rows': 0, 'valid_rows': 0, 'empty_rows': 0, 'mixed_rows': 0, 'aggregate': None}
              work = frame.copy()
              idx = pd.to_datetime(work.index, errors='coerce')
              work.index = idx
              day = work[[not pd.isna(ts) and ts.date() == target.date() for ts in idx]]
              valid = []
              empty_rows = 0
              mixed_rows = 0
              for ts, row in day.iterrows():
                  values = [finite(row[col]) if col in row.index else None for col in price_columns]
                  present = [value is not None for value in values]
                  if not any(present):
                      empty_rows += 1
                      continue
                  if not all(present):
                      mixed_rows += 1
                      continue
                  o, h, l, c, a = values
                  if min(values) <= 0 or h < l or h < max(o, c) or l > min(o, c):
                      mixed_rows += 1
                      continue
                  valid.append((ts, o, h, l, c, a))
              aggregate = None
              if len(valid) >= 2 and mixed_rows == 0:
                  aggregate = {
                      'Open': valid[0][1],
                      'High': max(row[2] for row in valid),
                      'Low': min(row[3] for row in valid),
                      'Close': valid[-1][4],
                      'Adj Close': valid[-1][5],
                  }
              return {
                  'raw_rows': int(len(day)),
                  'valid_rows': len(valid),
                  'empty_rows': empty_rows,
                  'mixed_rows': mixed_rows,
                  'tz': str(getattr(idx, 'tz', None)),
                  'aggregate': aggregate,
              }

          for symbol in symbols:
              result = {'symbol': symbol}
              for interval in ('1h', '15m'):
                  attempts = []
                  for attempt in range(2):
                      try:
                          frame = yf.Ticker(symbol).history(
                              start=target,
                              end=target + pd.Timedelta(days=1),
                              interval=interval,
                              auto_adjust=False,
                              actions=False,
                              prepost=False,
                              repair=False,
                              keepna=True,
                          )
                          attempts.append(summarize(frame))
                      except Exception as exc:
                          attempts.append({'error': f'{type(exc).__name__}: {exc}'})
                      time.sleep(1)
                  result[interval] = attempts
              print(json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
