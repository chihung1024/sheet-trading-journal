name: Terminal Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: terminal-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-reachability-audit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit/frontend-reachability-2026-08-20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/frontend-reachability-2026-08-20
          fetch-depth: 0
      - name: Build frontend import reachability graph
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('src').resolve()
          candidates = {
              p.resolve()
              for p in Path('src').rglob('*')
              if p.is_file() and p.suffix in {'.js', '.vue'}
          }
          import_re = re.compile(
              r'''(?:import\s+(?:[^'\";]*?\s+from\s+)?|export\s+[^'\";]*?\s+from\s+|import\s*\()\s*['\"]([^'\"]+)['\"]''',
              re.MULTILINE,
          )

          def resolve_import(source, spec):
              if not spec.startswith('.'):
                  return None
              base = (source.parent / spec).resolve()
              probes = [base]
              if base.suffix == '':
                  probes.extend([
                      base.with_suffix('.js'),
                      base.with_suffix('.vue'),
                      base / 'index.js',
                      base / 'index.vue',
                  ])
              for probe in probes:
                  if probe in candidates:
                      return probe
              return None

          edges = {p: set() for p in candidates}
          unresolved = []
          for path in sorted(candidates):
              text = path.read_text(errors='strict')
              for spec in import_re.findall(text):
                  resolved = resolve_import(path, spec)
                  if resolved is not None:
                      edges[path].add(resolved)
                  elif spec.startswith('.'):
                      unresolved.append({
                          'source': path.relative_to(Path.cwd()).as_posix(),
                          'specifier': spec,
                      })

          entry = Path('src/main.js').resolve()
          if entry not in candidates:
              raise SystemExit('src/main.js entry missing')
          reachable = set()
          stack = [entry]
          while stack:
              current = stack.pop()
              if current in reachable:
                  continue
              reachable.add(current)
              stack.extend(edges[current] - reachable)

          unreachable = sorted(
              p.relative_to(Path.cwd()).as_posix()
              for p in candidates - reachable
          )
          report = {
              'entry': 'src/main.js',
              'source_files': len(candidates),
              'reachable_files': len(reachable),
              'unreachable_files': unreachable,
              'unresolved_relative_imports': unresolved,
          }
          Path('frontend-reachability-audit.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if unresolved:
              raise SystemExit('Unresolved relative imports make reachability audit unsafe')
          PY
      - name: Restore terminal CI and commit audit report
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add frontend-reachability-audit.json .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: record frontend reachability'
          git push origin HEAD:audit/frontend-reachability-2026-08-20

  python-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'audit/frontend-reachability-2026-08-20' }}
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile retained Python runtime
        run: python -m compileall -q journal_engine main.py tools/run_portfolio_update.py

  worker-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'audit/frontend-reachability-2026-08-20' }}
    name: Worker security and deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Parse retained Worker runtime
        run: node --check worker.js && node --check worker-entry.js && node --check worker-dividend-event.js && node --check worker-journal-restore.js

  frontend-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'audit/frontend-reachability-2026-08-20' }}
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frozen production frontend
        run: npm run build
