name: Production verification for Update Portfolio Data 3317 final

on:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  verify-production:
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317-final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch merged-main Update Portfolio Data and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: f7bd7b7dc2e0ae28673fca11bae88f72d138c2f0
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')

          actual_main_sha="$(curl --silent --show-error --fail-with-body "${auth[@]}" "$api/branches/main" | jq -r '.commit.sha')"
          if [[ "$actual_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved: expected=$EXPECTED_MAIN_SHA actual=$actual_main_sha" >&2
            exit 1
          fi

          before_id="$(curl --silent --show-error --fail-with-body "${auth[@]}" "$api/actions/workflows/update.yml/runs?event=workflow_dispatch&branch=main&per_page=1" | jq -r '.workflow_runs[0].id // 0')"
          curl --silent --show-error --fail-with-body -X POST "${auth[@]}" \
            "$api/actions/workflows/update.yml/dispatches" \
            --data '{"ref":"main","inputs":{"custom_benchmark":"0050.TW","target_user_id":"","calculation_job_id":"","transaction_integrity_audit_only":"false"}}' >/dev/null

          run_id=""
          for _ in $(seq 1 60); do
            payload="$(curl --silent --show-error --fail-with-body "${auth[@]}" "$api/actions/workflows/update.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            run_id="$(jq -r --arg sha "$EXPECTED_MAIN_SHA" --argjson before "$before_id" '[.workflow_runs[] | select(.head_sha == $sha and .id > $before)] | sort_by(.id) | last | .id // empty' <<<"$payload")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'production workflow dispatch was not observed' >&2
            exit 1
          fi

          echo "PRODUCTION_RUN_ID=$run_id"
          for _ in $(seq 1 180); do
            run="$(curl --silent --show-error --fail-with-body "${auth[@]}" "$api/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            run_number="$(jq -r '.run_number' <<<"$run")"
            head_sha="$(jq -r '.head_sha' <<<"$run")"
            echo "PRODUCTION_STATUS=$status RUN_NUMBER=$run_number CONCLUSION=$conclusion HEAD_SHA=$head_sha"
            if [[ "$status" == 'completed' ]]; then
              echo "PRODUCTION_RUN_NUMBER=$run_number"
              echo "PRODUCTION_CONCLUSION=$conclusion"
              echo "PRODUCTION_HEAD_SHA=$head_sha"
              [[ "$head_sha" == "$EXPECTED_MAIN_SHA" ]]
              [[ "$conclusion" == 'success' ]]
              exit 0
            fi
            sleep 5
          done

          echo 'production workflow did not complete within verification bound' >&2
          exit 1
