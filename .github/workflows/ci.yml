name: Diagnostic DELL intraday interval semantics

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317-final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install pinned market-data client
        run: python -m pip install --disable-pip-version-check yfinance==1.5.2 pandas==2.3.3
      - name: Probe regular-session interval boundaries
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf
          from yfinance.data import YfData

          symbol = 'DELL'
          start = pd.Timestamp('2026-08-17')
          end = start + pd.Timedelta(days=1)
          for interval in ('1h', '30m', '15m', '5m'):
              YfData().cache_get.cache_clear()
              frame = yf.Ticker(symbol).history(
                  start=start,
                  end=end,
                  interval=interval,
                  auto_adjust=False,
                  actions=False,
                  prepost=False,
                  repair=False,
                  keepna=True,
                  timeout=10.0,
              )
              print(f'=== interval={interval} rows={len(frame)} tz={getattr(frame.index, "tz", None)} ===')
              cols = [c for c in ('Open','High','Low','Close','Adj Close','Volume') if c in frame.columns]
              if frame.empty:
                  print('EMPTY')
                  continue
              print(frame[cols].to_string())
              valid = frame.dropna(subset=[c for c in ('Open','High','Low','Close','Adj Close') if c in frame.columns])
              if not valid.empty:
                  agg = {
                      'Open': float(valid.iloc[0]['Open']),
                      'High': float(valid['High'].max()),
                      'Low': float(valid['Low'].min()),
                      'Close': float(valid.iloc[-1]['Close']),
                      'Adj Close': float(valid.iloc[-1]['Adj Close']),
                  }
                  print('AGG', agg)
          PY
