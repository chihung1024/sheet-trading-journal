name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-stabilized-cross-granularity-recovery:
    name: Apply stabilized cross-granularity recovery
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-stabilized-cross-granularity
          fetch-depth: 1
      - name: Patch bounded convergence protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('journal_engine/clients/semantic_market_data.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('import threading\n', 'import threading\nimport time\n', 1)
          text=text.replace(
              '_INTRADAY_RECOVERY_INTERVALS = ("1h", "15m")\n',
              '_INTRADAY_RECOVERY_INTERVALS = ("1h", "15m")\n_INTRADAY_RECOVERY_ROUNDS = 2\n_INTRADAY_REOBSERVATION_DELAY_SECONDS = 1.0\n',
              1,
          )
          pattern=re.compile(
              r'            candidates: dict\[str, dict\[str, float\]\] = \{\}\n'
              r'.*?'
              r'            staged\[event_date\] = first\n',
              re.S,
          )
          replacement='''            prior_disagreement: tuple[dict[str, float], dict[str, float]] | None = None
            consensus: dict[str, float] | None = None
            for observation_round in range(_INTRADAY_RECOVERY_ROUNDS):
                candidates: dict[str, dict[str, float]] = {}
                for interval in _INTRADAY_RECOVERY_INTERVALS:
                    try:
                        intraday = yf.Ticker(symbol).history(
                            start=event_date,
                            end=event_date + pd.Timedelta(days=1),
                            interval=interval,
                            auto_adjust=False,
                            actions=False,
                            prepost=False,
                            repair=False,
                            keepna=True,
                        )
                    except Exception as exc:
                        logger.warning(
                            "[%s] exact-date raw intraday recovery request failed for %s interval=%s round=%s: %s",
                            symbol,
                            event_date.strftime("%Y-%m-%d"),
                            interval,
                            observation_round + 1,
                            exc,
                        )
                        return frame, ()
                    candidate = self._complete_intraday_price_candidate(intraday, event_date)
                    if candidate is None:
                        logger.warning(
                            "[%s] exact-date raw intraday evidence invalid for %s interval=%s round=%s; fail closed",
                            symbol,
                            event_date.strftime("%Y-%m-%d"),
                            interval,
                            observation_round + 1,
                        )
                        return frame, ()
                    candidates[interval] = candidate[0]

                first_interval, second_interval = _INTRADAY_RECOVERY_INTERVALS
                first = candidates[first_interval]
                second = candidates[second_interval]
                if self._intraday_price_candidates_agree(first, second):
                    if prior_disagreement is not None:
                        if not (
                            self._intraday_price_candidates_agree(first, prior_disagreement[0])
                            or self._intraday_price_candidates_agree(first, prior_disagreement[1])
                        ):
                            logger.warning(
                                "[%s] exact-date raw intraday evidence converged to an unobserved third value for %s; fail closed: prior=%s current=%s",
                                symbol,
                                event_date.strftime("%Y-%m-%d"),
                                prior_disagreement,
                                first,
                            )
                            return frame, ()
                        logger.warning(
                            "[%s] exact-date raw intraday granularities converged after bounded re-observation for %s: consensus=%s",
                            symbol,
                            event_date.strftime("%Y-%m-%d"),
                            first,
                        )
                    consensus = first
                    break

                if observation_round + 1 >= _INTRADAY_RECOVERY_ROUNDS:
                    logger.warning(
                        "[%s] exact-date raw intraday granularities still disagree after %s rounds for %s (%s=%s vs %s=%s); fail closed",
                        symbol,
                        _INTRADAY_RECOVERY_ROUNDS,
                        event_date.strftime("%Y-%m-%d"),
                        first_interval,
                        first,
                        second_interval,
                        second,
                    )
                    return frame, ()

                prior_disagreement = (first, second)
                logger.warning(
                    "[%s] exact-date raw intraday granularities disagree for %s (%s=%s vs %s=%s); bounded re-observation 1/%s",
                    symbol,
                    event_date.strftime("%Y-%m-%d"),
                    first_interval,
                    first,
                    second_interval,
                    second,
                    _INTRADAY_RECOVERY_ROUNDS - 1,
                )
                time.sleep(_INTRADAY_REOBSERVATION_DELAY_SECONDS)

            if consensus is None:
                return frame, ()
            staged[event_date] = consensus
'''
          text,n=pattern.subn(replacement,text,count=1)
          if n!=1:
              raise SystemExit(f'expected one recovery block, replaced {n}')
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile journal_engine/clients/semantic_market_data.py
          git diff --check
      - name: Commit target branch patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py
          git commit -m 'fix: stabilize cross-granularity market evidence'
          git push origin HEAD:fix/market-data-stabilized-cross-granularity
