name: Terminal Integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-reachability-audit:
    if: ${{ github.event.pull_request.head.ref == 'audit/python-reachability-2026-08-20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit Python import reachability
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, importlib.util, json

          paths = [Path('main.py'), Path('tools/run_portfolio_update.py')]
          paths += sorted(Path('journal_engine').rglob('*.py'))

          def module_name(path):
              if path == Path('main.py'):
                  return 'main'
              parts = list(path.with_suffix('').parts)
              if parts[-1] == '__init__':
                  parts.pop()
              return '.'.join(parts)

          by_module = {module_name(p): p for p in paths}
          edges = {name: set() for name in by_module}
          dynamic = []

          def add_parent_packages(targets, name):
              parts = name.split('.')
              for i in range(1, len(parts)):
                  pkg = '.'.join(parts[:i])
                  if pkg in by_module:
                      targets.add(pkg)

          for name, path in by_module.items():
              tree = ast.parse(path.read_text(), filename=str(path))
              package = name if path.name == '__init__.py' else name.rpartition('.')[0]
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          target = alias.name
                          if target in by_module:
                              edges[name].add(target)
                              add_parent_packages(edges[name], target)
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          try:
                              base = importlib.util.resolve_name('.' * node.level + (node.module or ''), package)
                          except Exception:
                              continue
                      else:
                          base = node.module or ''
                      if base in by_module:
                          edges[name].add(base)
                          add_parent_packages(edges[name], base)
                      for alias in node.names:
                          candidate = f'{base}.{alias.name}' if base else alias.name
                          if candidate in by_module:
                              edges[name].add(candidate)
                              add_parent_packages(edges[name], candidate)
                  elif isinstance(node, ast.Call):
                      fn = node.func
                      fn_name = ''
                      if isinstance(fn, ast.Name):
                          fn_name = fn.id
                      elif isinstance(fn, ast.Attribute):
                          fn_name = fn.attr
                      if fn_name in {'import_module', '__import__'}:
                          dynamic.append({'source': str(path), 'line': node.lineno})

          entries = {'main', 'tools.run_portfolio_update'}
          reachable = set()
          stack = list(entries)
          while stack:
              current = stack.pop()
              if current in reachable or current not in by_module:
                  continue
              reachable.add(current)
              stack.extend(edges[current] - reachable)

          unreachable = sorted(
              str(by_module[name]) for name in by_module if name not in reachable
          )
          report = {
              'python_files': len(by_module),
              'reachable_files': len(reachable),
              'unreachable_files': unreachable,
              'dynamic_import_calls': dynamic,
          }
          print(json.dumps(report, indent=2))
          PY
