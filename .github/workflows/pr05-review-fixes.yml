name: PR-05 Review Fixes

on:
  push:
    branches:
      - pr-05/worker-reproducible-deployment

permissions:
  contents: write

concurrency:
  group: pr05-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'PR-05: run independent review fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR-05 branch
        uses: actions/checkout@v7
        with:
          ref: pr-05/worker-reproducible-deployment
          fetch-depth: 0

      - name: Apply reviewed fix patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr05-review-fixes/chunk-* > /tmp/pr05-review-fixes.b64
          base64 --decode /tmp/pr05-review-fixes.b64 > /tmp/pr05-review-fixes.patch
          echo "d7a1b0186289482a394ffc7ea6f720dfeedecfce6c0ab953e663c4add40cc468  /tmp/pr05-review-fixes.patch" | sha256sum --check
          git apply --check /tmp/pr05-review-fixes.patch
          git apply /tmp/pr05-review-fixes.patch

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Verify independent review fixes
        run: |
          npm ci --no-audit --no-fund
          npm run test:worker
          npm run worker:config:check
          npm run worker:schema:test
          npm run build

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr05-review-fixes
          git config user.name "chihung1024"
          git config user.email "104315542+chihung1024@users.noreply.github.com"
          git add worker.js tools/render_wrangler_config.mjs tests/worker_deployment.test.mjs docs/WORKER_DEPLOYMENT.md wrangler.toml .pr05-review-fixes
          git commit -m "PR-05: harden production deploy source and metadata validation"
          git push origin HEAD:pr-05/worker-reproducible-deployment
