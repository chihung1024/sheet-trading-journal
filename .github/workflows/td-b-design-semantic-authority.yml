# diagnostic revision: raw-template-v2
name: One-time TD-B design semantic authority cleanup

on:
  push:
    branches:
      - refactor/td-b-design-semantic-authority
    paths:
      - .github/workflows/td-b-design-semantic-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/td-b-design-semantic-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Repair one-time codemod for reviewed exact semantics
        run: node tools/fix_td_b_codemod_parser.mjs
      - name: Apply bounded cleanup
        run: node tools/td_b_design_semantic_cleanup.mjs
      - name: Typography resolver behavior
        run: node --test --test-name-pattern="semantic typography bridge resolves" tests/frontend_design_typography_bridge.test.mjs
      - name: Typography fail-closed behavior
        if: always()
        run: node --test --test-name-pattern="semantic typography bridge fails closed" tests/frontend_design_typography_bridge.test.mjs
      - name: PerformanceChart semantic typography source contract
        if: always()
        run: node --test --test-name-pattern="PerformanceChart consumes" tests/frontend_design_typography_bridge.test.mjs
      - name: Portfolio surface terminology
        if: always()
        run: node --test --test-name-pattern="current portfolio UI names" tests/frontend_portfolio_terminology.test.mjs
      - name: Portfolio misleading-label exclusion
        if: always()
        run: node --test --test-name-pattern="misleading cash-inclusive" tests/frontend_portfolio_terminology.test.mjs
      - name: Portfolio documentation terminology
        if: always()
        run: node --test --test-name-pattern="documentation states" tests/frontend_portfolio_terminology.test.mjs
      - name: Gate existing strategy terminology contract
        if: always()
        run: node --test tests/frontend_strategy_group_overview.test.mjs
      - name: Gate existing typography authority
        if: always()
        run: node --test tests/frontend_typography_authority.test.mjs
      - name: Validate full frontend contracts
        if: always()
        run: npm run test:frontend
      - name: Validate production build
        run: npm run build
      - name: Compile touched Python model
        run: python -m py_compile journal_engine/models.py
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit cleanup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests README.md journal_engine/models.py
          git diff --cached --quiet && exit 0
          git commit -m "Refactor: close design and portfolio semantic authority debt"
          git push origin HEAD:refactor/td-b-design-semantic-authority
