# diagnostic revision: per-file-whitespace
name: One-time TD-B design semantic authority cleanup

on:
  push:
    branches:
      - refactor/td-b-design-semantic-authority
    paths:
      - .github/workflows/td-b-design-semantic-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/td-b-design-semantic-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair one-time codemod for reviewed exact semantics
        run: node tools/fix_td_b_codemod_parser.mjs
      - name: Apply bounded cleanup
        run: node tools/td_b_design_semantic_cleanup.mjs
      - name: Hygiene README
        if: always()
        run: git diff --check -- README.md
      - name: Hygiene models
        if: always()
        run: git diff --check -- journal_engine/models.py
      - name: Hygiene PerformanceChart
        if: always()
        run: git diff --check -- src/components/PerformanceChart.vue
      - name: Hygiene StatsGrid
        if: always()
        run: git diff --check -- src/components/StatsGrid.vue
      - name: Hygiene StrategyGroupOverview
        if: always()
        run: git diff --check -- src/components/StrategyGroupOverview.vue
      - name: Hygiene StatsGridSkeleton
        if: always()
        run: git diff --check -- src/components/skeletons/StatsGridSkeleton.vue
      - name: Hygiene designTypography
        if: always()
        run: git diff --check -- src/services/designTypography.js
      - name: Hygiene typography bridge test
        if: always()
        run: git diff --check -- tests/frontend_design_typography_bridge.test.mjs
      - name: Hygiene terminology test
        if: always()
        run: git diff --check -- tests/frontend_portfolio_terminology.test.mjs
      - name: Hygiene strategy regression
        if: always()
        run: git diff --check -- tests/frontend_strategy_group_overview.test.mjs
