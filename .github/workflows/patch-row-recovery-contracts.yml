name: Patch row-recovery contract migrations

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'diagnostic/update-portfolio-3317-final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-row-recovery-composition
          persist-credentials: true
          fetch-depth: 1
      - name: Migrate row-level recovery contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('journal_engine/clients/semantic_market_data.py')
          text = source.read_text(encoding='utf-8')
          old = '        return tuple(signature)\n\n    def _prepare_data'
          new = '        return tuple(signature) if signature else None\n\n    def _prepare_data'
          if old not in text:
              raise RuntimeError('classifier return contract not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          classifier = Path('tests/test_semantic_market_data_classifier.py')
          text = classifier.read_text(encoding='utf-8')
          text = text.replace('_pure_action_only_signature', '_dividend_action_only_signature')
          old = '    tickers = iter([_Ticker(_intraday_row(final_close=102.0)), _Ticker(_intraday_row(final_close=102.5))])\n'
          new = '''    tickers = iter(\n        [\n            _Ticker(_intraday_row(final_close=102.0)),\n            _Ticker(_intraday_row(final_close=102.5)),\n            _Ticker(pd.DataFrame()),\n        ]\n    )\n'''
          if old not in text:
              raise RuntimeError('classifier disagreement fixture not found')
          classifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          defensive = Path('tests/test_semantic_market_data_intraday_defensive.py')
          text = defensive.read_text(encoding='utf-8')
          defensive.write_text(
              text.replace('_pure_action_only_signature', '_dividend_action_only_signature'),
              encoding='utf-8',
          )

          for filename, test_name in (
              ('tests/test_semantic_market_data.py', 'test_exact_date_intraday_recovery_rejects_disagreeing_granularities'),
              ('tests/test_market_data_repair_fallback.py', 'test_cross_granularity_intraday_observations_must_agree'),
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              start = text.index(f'def {test_name}():')
              next_def = text.find('\ndef ', start + 5)
              end = len(text) if next_def == -1 else next_def
              block = text[start:end]
              if 'assert calls["AAA"] == 4' not in block:
                  raise RuntimeError(f'call-count contract not found in {test_name}')
              block = block.replace('assert calls["AAA"] == 4', 'assert calls["AAA"] == 5', 1)
              path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          python -m compileall -q journal_engine tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_engine/clients/semantic_market_data.py \
            tests/test_semantic_market_data_classifier.py \
            tests/test_semantic_market_data_intraday_defensive.py \
            tests/test_semantic_market_data.py \
            tests/test_market_data_repair_fallback.py
          git diff --cached --check
          git commit -m 'test: migrate row-level recovery contracts'
          git push origin HEAD:fix/market-data-row-recovery-composition
