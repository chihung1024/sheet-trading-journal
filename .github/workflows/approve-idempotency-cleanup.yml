name: Identify idempotency cleanup production reviewer

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: ${{ github.head_ref == 'diagnostic/approve-idempotency-cleanup' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect pending production deployment reviewer contract
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '32152361874'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/pending_deployments" > /tmp/pending.json
          jq -e 'length > 0' /tmp/pending.json >/dev/null
          jq -r '.[] | "PENDING environment=\(.environment.name) id=\(.environment.id) wait_timer=\(.wait_timer) reviewers=\(.reviewers | length)"' /tmp/pending.json
          jq -r '.[] | .reviewers[]? | "REVIEWER type=\(.type) login=\(.reviewer.login // .reviewer.name // "unknown") id=\(.reviewer.id // "unknown")"' /tmp/pending.json
