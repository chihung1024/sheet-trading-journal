name: Migrate general market evidence quorum contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'diagnostic/generalize-market-evidence-quorum' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-row-recovery-composition
          persist-credentials: true
          fetch-depth: 1
      - name: Replace obsolete fail-fast contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_semantic_market_data_classifier.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_exact_date_intraday_recovery_rejects_invalid_granularity_before_second_query():
              client = SemanticMarketDataClient()
              frame = _prepared_partial_row()
              with patch(
                  "journal_engine.clients.semantic_market_data.yf.Ticker",
                  return_value=_Ticker(pd.DataFrame()),
              ) as ticker:
                  result, dates = client._recover_with_exact_date_intraday_evidence("AAA", frame)
          
              assert result is frame
              assert dates == ()
              assert ticker.call_count == 1
          '''.replace('\n              ', '\n')
          new = '''def test_exact_date_intraday_recovery_stops_when_quorum_becomes_impossible():
              client = SemanticMarketDataClient()
              frame = _prepared_partial_row()
              with patch(
                  "journal_engine.clients.semantic_market_data.yf.Ticker",
                  return_value=_Ticker(pd.DataFrame()),
              ) as ticker:
                  result, dates = client._recover_with_exact_date_intraday_evidence("AAA", frame)
          
              assert result is frame
              assert dates == ()
              assert ticker.call_count == 2
          '''.replace('\n              ', '\n')
          if old not in text:
              raise RuntimeError('obsolete fail-fast test contract not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q journal_engine tests/test_semantic_market_data_classifier.py tests/test_semantic_market_data_stabilization.py
          python -m pip install --disable-pip-version-check -q -r requirements-dev.txt
          python -m pytest -q tests/test_semantic_market_data_classifier.py tests/test_semantic_market_data_stabilization.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_semantic_market_data_classifier.py
          git commit -m 'test: replace interval fail-fast with quorum exhaustion contract'
          git push origin HEAD:fix/market-data-row-recovery-composition
