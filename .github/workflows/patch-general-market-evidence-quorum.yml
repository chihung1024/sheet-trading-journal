name: Update concise portfolio recovery handoff

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'diagnostic/generalize-market-evidence-quorum' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/market-data-row-recovery-composition
          persist-credentials: true
          fetch-depth: 1
      - name: Update concise live truth
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('to_do_update_list.md')
          text = path.read_text(encoding='utf-8')

          old = "Current line: **R1, R2.1–R2.6A, R3.1A–R3.1C, Desktop Visibility D1–D5, R3.2A–R3.2F, and R3.3A are closed at their reviewed engineering boundaries. R2.6B cash-inclusive whole-account Daily P&L is merged and CI-reviewed, but fresh production financial-snapshot evidence is still pending and must not be inferred. R3.3A Import Reconciliation Receipt merged as PR #365 at `main@26c74af8429f3d17380c278f53828008d01fee1e` after exact-head CI #1238 and frozen review PASS. The single Primary Active Batch is R3.3B — Safe Ambiguous Import Retry.**"
          new = "Current line: **R3.3B remains open but is temporarily PAUSED. The single Primary Active Batch is P0 — Update Portfolio Data #3317 systemic production-correctness closeout. `main@f7bd7b7dc2e0ae28673fca11bae88f72d138c2f0` contains the merged XIRR safety-domain repair (#373). PR #376 is the unmerged symbol/date-agnostic market-data recovery refactor; exact-head CI #1349 is green across Frontend, 658 Python tests + branch-coverage governance, and Worker/D1/security. Merged-main production success is mandatory before P0 closes.**"
          if old not in text:
              raise RuntimeError('current-line marker not found')
          text = text.replace(old, new, 1)

          old = '- protected frontend/engine `main`: `26c74af8429f3d17380c278f53828008d01fee1e` (`feat: add shared import reconciliation receipt (#365)`);'
          new = '- protected `main` at the current P0 boundary: `f7bd7b7dc2e0ae28673fca11bae88f72d138c2f0` (PR #373 XIRR safety-domain repair); PR #376 remains deliberately unmerged pending frozen closeout and production verification;'
          if old not in text:
              raise RuntimeError('main-truth marker not found')
          text = text.replace(old, new, 1)

          if '## 5. Primary Active Batch\n' not in text:
              raise RuntimeError('R3.3B heading marker not found')
          text = text.replace(
              '## 5. Primary Active Batch\n',
              '## 5. Paused Product Batch — resume after P0 closeout\n',
              1,
          )
          if 'Status: **ACTIVE / CONTRACT-FIRST**' not in text:
              raise RuntimeError('R3.3B status marker not found')
          text = text.replace(
              'Status: **ACTIVE / CONTRACT-FIRST**',
              'Status: **PAUSED / CONTRACT PRESERVED**',
              1,
          )

          anchor = '> Stable closeout evidence lives under `docs/engineering/`; this file is a concise live handoff, not a history dump.\n'
          note = '> Current P0 RCA: `docs/engineering/update-portfolio-3317-systemic-rca.md`.\n'
          if anchor not in text:
              raise RuntimeError('handoff evidence anchor not found')
          if note not in text:
              text = text.replace(anchor, anchor + note, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -F 'P0 — Update Portfolio Data #3317 systemic production-correctness closeout' to_do_update_list.md
          grep -F 'PAUSED / CONTRACT PRESERVED' to_do_update_list.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add to_do_update_list.md
          git commit -m 'docs: update live portfolio recovery handoff'
          git push origin HEAD:fix/market-data-row-recovery-composition
