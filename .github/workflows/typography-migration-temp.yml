name: Typography Migration Temporary

on:
  push:
    branches:
      - feat/phase13-2-typography-density-convergence

permissions:
  contents: write

concurrency:
  group: typography-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/phase13-2-typography-density-convergence
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Migrate component typography to semantic tokens
        run: node tools/migrate_typography_tokens.mjs

      - name: Run complete frontend contract suite
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Commit migration when required
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No typography migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src index.html
          git commit -m "refactor: migrate component typography to semantic tokens"
          git push origin HEAD:feat/phase13-2-typography-density-convergence
