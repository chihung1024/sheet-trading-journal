name: Production Deployment Dispatch Broker

on:
  push:
    branches:
      - main
    paths:
      - config/production-deployment-request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deployment-dispatch-broker
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate authority and dispatch canonical deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact request control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact protected-main deployment request and authority
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          event_sha="$(git rev-parse HEAD)"
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$event_sha" != "$latest_main" ]]; then
            echo "Refusing stale production deployment request: event SHA is no longer protected-main HEAD" >&2
            exit 1
          fi

          source_sha="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const request = JSON.parse(readFileSync('config/production-deployment-request.json', 'utf8'));
          const shaRe = /^[0-9a-f]{40}$/;
          const idRe = /^[A-Za-z0-9._-]{8,128}$/;
          if (request?.schema_version !== 1) throw new Error('deployment request schema_version must equal 1');
          if (typeof request?.request_id !== 'string' || !idRe.test(request.request_id)) throw new Error('deployment request_id is invalid');
          if (typeof request?.source_sha !== 'string' || !shaRe.test(request.source_sha)) throw new Error('deployment source_sha must be an exact lowercase 40-character SHA');
          if (typeof request?.requested_at !== 'string' || !Number.isFinite(Date.parse(request.requested_at))) throw new Error('deployment requested_at must be ISO-8601');
          if (typeof request?.reason !== 'string' || request.reason.trim().length === 0) throw new Error('deployment reason is required');
          process.stdout.write(request.source_sha);
          NODE
          )"

          git cat-file -e "${source_sha}^{commit}"
          if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main; then
            echo "Refusing deployment request for a source that is not reachable from protected main" >&2
            exit 1
          fi

          EXPECTED_SHA="$source_sha" node tools/verify_production_activation_authority.mjs
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Deploy Worker workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          payload="$(node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({
            ref: 'main',
            inputs: { source_sha: process.env.SOURCE_SHA },
          }));
          NODE
          )"
          response_file="$RUNNER_TEMP/deploy-dispatch-response.json"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-worker.yml/dispatches" \
            --data "$payload")"
          if [[ "$status" != "200" ]]; then
            echo "Canonical Deploy Worker dispatch failed with HTTP $status" >&2
            exit 1
          fi
          export RESPONSE_FILE="$response_file"
          run_id="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          const runId = String(body?.workflow_run_id ?? '');
          if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('dispatch response omitted a valid workflow_run_id');
          process.stdout.write(runId);
          NODE
          )"
          echo "workflow_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Canonical Deploy Worker dispatched: run_id=$run_id source_sha=$SOURCE_SHA"
