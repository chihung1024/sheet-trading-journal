name: One-time TD-A presentation authority cleanup

on:
  push:
    branches:
      - refactor/td-a-presentation-authority
    paths:
      - .github/workflows/td-a-presentation-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/td-a-presentation-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply bounded cleanup
        run: node tools/td_a_presentation_authority_cleanup.mjs
      - name: Validate frontend contracts
        run: npm run test:frontend
      - name: Validate production build
        run: npm run build
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit cleanup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Refactor: close overview presentation authority debt"
          git push origin HEAD:refactor/td-a-presentation-authority
