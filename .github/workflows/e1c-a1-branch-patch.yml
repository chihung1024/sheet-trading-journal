  });
  assert.equal(first.inserted, true);
  assert.equal(rotated.inserted, true);
  assert.equal(rotated.job.public_id, ALT_JOB_ID);
  assert.equal(rowsById.size, 2);
});

test("dispatch-bound queued row continues to protect legacy cross-key retries", async () => {
  const { db, rowsById } = createCalculationJobsDb();
  const firstHash = await __test.hashCalculationJobIdempotency(USER_ID, "action.bound.first.1234567");
  const rotatedHash = await __test.hashCalculationJobIdempotency(USER_ID, "action.bound.second.123456");

  await __test.calculationJobsRepository.createOrGet(db, {
    publicId: JOB_ID,
    userId: USER_ID,
    idempotencyHash: firstHash,
    benchmark: "SPY",
  });
  rowsById.get(JOB_ID).created_at = "2026-08-06 00:00:00";
  const bound = await __test.calculationJobsRepository.bindDispatchRun(db, JOB_ID, "31460959779");
  assert.equal(bound.kind, "bound");
  assert.equal(bound.job.github_run_id, "31460959779");

  const rotated = await __test.calculationJobsRepository.createOrGet(db, {
    publicId: ALT_JOB_ID,
    userId: USER_ID,
    idempotencyHash: rotatedHash,
    benchmark: "SPY",
  });
  assert.equal(rotated.inserted, false);
  assert.equal(rotated.job.public_id, JOB_ID);
  assert.equal(rowsById.size, 1);
});

test("dispatch run binding is idempotent and refuses conflicting run identity", async () => {
  const { db } = createCalculationJobsDb();
  const hash = await __test.hashCalculationJobIdempotency(USER_ID, "action.bind.run.123456789");
  await __test.calculationJobsRepository.createOrGet(db, {
    publicId: JOB_ID,
    userId: USER_ID,
    idempotencyHash: hash,
    benchmark: "SPY",
  });
  const first = await __test.calculationJobsRepository.bindDispatchRun(db, JOB_ID, 31460959779);
  assert.equal(first.kind, "bound");
  const replay = await __test.calculationJobsRepository.bindDispatchRun(db, JOB_ID, "31460959779");
  assert.equal(replay.kind, "idempotent");
  const conflict = await __test.calculationJobsRepository.bindDispatchRun(db, JOB_ID, "31460959780");
  assert.equal(conflict.kind, "conflict");
  assert.equal(conflict.job.github_run_id, "31460959779");
});

test("cross-key SQL requires positive dispatch evidence or short binding grace", async () => {
  const { db, statements } = createCalculationJobsDb();
  const hash = await __test.hashCalculationJobIdempotency(USER_ID, "action.sql.guard.123456789");
  await __test.calculationJobsRepository.createOrGet(db, {
    publicId: JOB_ID,
    userId: USER_ID,
    idempotencyHash: hash,
    benchmark: "SPY",
  });
  const insertSql = statements.find(sql => sql.startsWith("INSERT OR IGNORE INTO calculation_jobs"));
  assert.ok(insertSql);
  assert.match(insertSql, /status = 'running'/);
  assert.match(insertSql, /github_run_id IS NOT NULL/);
  assert.match(insertSql, /created_at > datetime\('now', \?\)/);
});

'''
          life = replace_once(life, marker, addition + marker, 'lifecycle A1 tests')
          lifecycle_path.write_text(life)

          doc = Path('docs/engineering/GATE_E_E1C_A1_DISPATCH_BINDING_2026-08-11.md')
          doc.write_text('''# Gate E / E1c-A.1 — Dispatch Binding and Legacy Orphan Recovery\n\nStatus: **IMPLEMENTATION CANDIDATE**  \nDate: **2026-08-11**\n\n## Production blocker\n\nAfter E1c-A Worker runtime `94215c9dfec54a9da80ceac9782a6aca16bee8ad` was deployed and stable, a normal authenticated frontend trigger remained in `計算中...` while repeated remote checks showed no new `Update Portfolio Data` GitHub Actions run. The last existing run (#3235 / `31455526265`) had already completed successfully with a terminal `succeeded` callback before the E1c-A deployment.\n\nThis proves the frontend was polling a durable active job that did not correspond to a newly dispatched workflow. E1c-A's server-first cross-key guard correctly prevented duplicate work, but it also surfaced a legacy rollout residue: an old `queued` row with no durable GitHub dispatch identity could be treated as active forever.\n\n## Root cause\n\nE1c-A made lifecycle state authoritative and added cross-key active dedupe for old 15-minute clients. However, Worker dispatch used GitHub REST API version `2022-11-28`, where this code only consumed HTTP success and an `X-GitHub-Request-Id`; `calculation_jobs.github_run_id` was not populated until the workflow itself reached the `running` callback.\n\nThat leaves no positive dispatch identity for a queued row before callback and makes historical `queued + github_run_id IS NULL` residue indistinguishable from a legitimately accepted pending workflow.\n\nGitHub REST API `2026-03-10` returns HTTP 200 with `workflow_run_id` for workflow dispatch. E1c-A.1 uses that existing upstream capability and the already-existing Schema 2 `github_run_id` column; no schema migration is required.\n\n## Locked correction\n\n1. Upgrade the Worker workflow-dispatch request to GitHub API version `2026-03-10`.\n2. Treat a successful dispatch as valid only when HTTP 200 returns a valid positive `workflow_run_id`; legacy 204 or malformed/missing run identity fails closed.\n3. Bind the accepted GitHub run ID into the durable job before returning HTTP 202 to the browser. Binding is idempotent for the same run ID and conflicts on a different existing run ID.\n4. Exact idempotency-key replay remains first-class and never expires an active row by age.\n5. Cross-key compatibility dedupe considers a same-tenant/same-benchmark row active when it is `running`, has a durable `github_run_id`, or is within a short 60-second dispatch-binding grace.\n6. A historical old `queued + github_run_id IS NULL` row therefore cannot permanently block a different key. The 60-second grace is not lifecycle expiry: it applies only to cross-key compatibility while a newly inserted job is between D1 insert and dispatch binding.\n7. Different benchmark remains a distinct calculation intent.\n8. No frontend TTL, workflow concurrency, D1 schema, E1d, financial logic, tenant identity, or privacy contract changes are part of this hotfix.\n\n## Risk\n\n**R3 — production lifecycle / dispatch identity / duplicate-execution correctness.**\n\nA defect can either duplicate a calculation or suppress a legitimate active job. Exact-head CI, fresh R3 Independent Review, expected-head merge, fresh production identity/authority, exact-source Worker deployment, and a normal frontend production smoke remain required.\n\nRecovery: `backup-pre-e1c-a1-dispatch-binding-6e4e464`.\n\n## E1c-B remains deferred\n\nE1c-B still owns browser lifecycle-based pending recovery and GitHub Actions `queue: max`. It may not proceed until E1c-A.1 is production-deployed and the normal frontend path produces a new bound workflow that reaches terminal state.\n''')
          PY

          git diff --check
          node --check worker.js
          node --test tests/worker_dispatch.test.mjs tests/worker_calculation_jobs.test.mjs

      - name: Commit branch patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js tests/worker_dispatch.test.mjs tests/worker_calculation_jobs.test.mjs docs/engineering/GATE_E_E1C_A1_DISPATCH_BINDING_2026-08-11.md; then
            echo 'No patch changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js tests/worker_dispatch.test.mjs tests/worker_calculation_jobs.test.mjs docs/engineering/GATE_E_E1C_A1_DISPATCH_BINDING_2026-08-11.md
          git commit -m 'fix: bind E1c dispatch runs and bypass legacy queued residue'
