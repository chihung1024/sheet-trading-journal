name: E1c-A.1 Branch Patch

on:
  push:
    branches:
      - gate-e-e1c-a1-dispatch-binding
    paths:
      - .github/workflows/e1c-a1-branch-patch.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Generate and validate candidate
        run: |
          set -euo pipefail
          python tools/e1c_a1_branch_patch.py
          git diff --check
          node --check worker.js
          node --test tests/worker_dispatch.test.mjs tests/worker_calculation_jobs.test.mjs
      - name: Upload verified candidate files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e1c-a1-candidate-files
          path: |
            worker.js
            tests/worker_dispatch.test.mjs
            tests/worker_calculation_jobs.test.mjs
            docs/engineering/GATE_E_E1C_A1_DISPATCH_BINDING_2026-08-11.md
          if-no-files-found: error
          retention-days: 3
