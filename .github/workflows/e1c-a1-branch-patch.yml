name: E1c-A.1 Branch Patch

on:
  push:
    branches:
      - gate-e-e1c-a1-dispatch-binding
    paths:
      - .github/workflows/e1c-a1-branch-patch.yml

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: echo 'isolated branch runner available'
