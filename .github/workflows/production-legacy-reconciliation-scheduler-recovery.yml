name: Production Legacy Reconciliation Scheduler Recovery

on:
  push:
    branches:
      - main
    paths:
      - config/production-legacy-reconciliation-scheduler-recovery.json

permissions:
  contents: read
  actions: write

concurrency:
  group: production-legacy-reconciliation-scheduler-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Cancel only the reviewed scheduler-stuck reconciliation run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact scheduler recovery control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate exact protected-main scheduler recovery request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          event_sha="$(git rev-parse HEAD)"
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$event_sha" != "$latest_main" ]]; then
            echo "Refusing stale scheduler recovery request: event SHA is no longer protected-main HEAD" >&2
            exit 1
          fi
          node tools/recover_stuck_reconciliation_run.mjs verify-request \
            config/production-legacy-reconciliation-scheduler-recovery.json

      - name: Cancel only the still-unstarted reviewed target run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_OUTPUT: production-e1c-a1-scheduler-recovery.json
        run: node tools/recover_stuck_reconciliation_run.mjs execute config/production-legacy-reconciliation-scheduler-recovery.json

      - name: Upload sanitized scheduler recovery evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-e1c-a1-scheduler-recovery-${{ github.sha }}
          path: production-e1c-a1-scheduler-recovery.json
          if-no-files-found: error
          retention-days: 30
