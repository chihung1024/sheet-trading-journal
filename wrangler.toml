# Canonical Cloudflare Worker deployment configuration.
#
# The all-zero D1 UUID is intentionally safe for local development only.
# Production deployment MUST run `npm run worker:config:render`, which refuses
# the sentinel and writes `.wrangler/deploy.toml` from protected CI variables.
#
# Production non-secret bindings are deliberately tracked here because Wrangler
# treats its config as source of truth and removes dashboard vars by default.
# Secrets remain protected in Cloudflare and are declared as required below.

name = "journal-backend"
main = "worker-entry.js"
compatibility_date = "2026-08-05"
workers_dev = true
preview_urls = false
keep_vars = false

[observability]
enabled = true
head_sampling_rate = 0.1

[version_metadata]
binding = "CF_VERSION_METADATA"

[secrets]
required = ["API_SECRET"]

[vars]
RELEASE_VERSION = "4.12"
API_VERSION = "2.65"
SCHEMA_VERSION = "3"
SOURCE_COMMIT = "development"
DEPLOYMENT_ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://sheet-trading-journal.pages.dev,https://chihung1024.github.io"
GOOGLE_CLIENT_ID = "951186116587-0ehsmkvlu3uivduc7kjn1jpp9ga7810i.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "trading-journal-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
migrations_table = "d1_migrations"
